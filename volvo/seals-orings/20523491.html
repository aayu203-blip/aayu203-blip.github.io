<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo Differential Seal & O-Ring Kit — OEM 20523491","description":"Complete differential seal and O-ring kit for Volvo FH, FMX, FE, FM Series trucks. Includes axle shaft seals, pinion input seal, housing gaskets, and O-ring pack. OEM part number 20523491.","sku":"20523491","mpn":"20523491","brand":{"@type":"Brand","name":"Volvo"},"additionalProperty":[{"@type":"PropertyValue","name":"HSN Code","value":"40169960"},{"@type":"PropertyValue","name":"Seal Material","value":"NBR / FKM Rubber"},{"@type":"PropertyValue","name":"Application","value":"Rear Differential Housing"},{"@type":"PropertyValue","name":"Compatible Makes","value":"Volvo FH, FMX, FE, FM"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does Volvo part 20523491 include?","acceptedAnswer":{"@type":"Answer","text":"Volvo 20523491 is a complete differential seal and O-ring kit. It includes both axle shaft seals, the pinion input shaft seal, the differential housing gasket or sealing compound, and an assorted O-ring pack for drain/fill plugs, the breather boss, and sensor ports."}},{"@type":"Question","name":"Which Volvo trucks use the 20523491 differential kit?","acceptedAnswer":{"@type":"Answer","text":"The 20523491 is used across the Volvo FH, FMX, FE, and FM Series with Volvo rear axles. Always confirm the correct kit for your specific axle type — single-reduction or hub-reduction — against your truck chassis plate or Volvo IMPACT before ordering."}},{"@type":"Question","name":"How do I know my differential seals have failed?","acceptedAnswer":{"@type":"Answer","text":"Common signs are oil streaks on the inner face of the rear wheels, oil staining on the brake drum or disc, an oil trail under the rear axle, or a consistently low differential oil level between service intervals."}},{"@type":"Question","name":"Can a leaking differential seal contaminate the brakes?","acceptedAnswer":{"@type":"Answer","text":"Yes — a failed axle shaft seal allows differential oil to migrate along the axle tube onto the brake linings or disc. Oil-contaminated brakes have severely reduced friction and can cause brake fade or failure. Immediate replacement is required."}},{"@type":"Question","name":"Can I replace just the pinion seal without the full kit?","acceptedAnswer":{"@type":"Answer","text":"You can, but fitting the full 20523491 kit is recommended whenever the differential is apart. All seals have similar service lives; the labour to access the differential is the same whether you fit one seal or all of them."}},{"@type":"Question","name":"What oil goes in a Volvo FH or FMX rear differential?","acceptedAnswer":{"@type":"Answer","text":"Volvo specifies API GL-5 hypoid gear oil. Check the specific viscosity grade (typically 75W-90 or 80W-140 depending on climate and axle specification) in your truck's service manual or via Volvo IMPACT."}},{"@type":"Question","name":"Do I need to replace the pinion bearing when fitting new seals?","acceptedAnswer":{"@type":"Answer","text":"Not automatically. However, if the magnetic drain plug shows significant metallic debris or there is play or roughness in the pinion flange, inspect and replace the pinion bearings before refitting."}},{"@type":"Question","name":"Can I reuse the pinion flange nut?","acceptedAnswer":{"@type":"Answer","text":"No. The pinion flange nut is a prevailing-torque nut that sets pinion bearing preload. Reusing it risks incorrect preload and bearing failure. Always fit a new nut and torque to specification."}},{"@type":"Question","name":"How long does a differential seal kit replacement take?","acceptedAnswer":{"@type":"Answer","text":"A full kit replacement covering all seals, gaskets, and O-rings typically takes 4–6 hours. The pinion seal alone takes 1–2 hours. Each axle shaft seal takes approximately 30–45 minutes per side."}},{"@type":"Question","name":"Is PTC's 20523491 OEM-compatible?","acceptedAnswer":{"@type":"Answer","text":"Yes. Parts Trading Company supplies OEM-specification 20523491 kits matching Volvo's original design for seal materials and dimensional tolerances. Same-day dispatch from Mumbai and 60-minute WhatsApp quote guaranteed."}}]},{"@type":"HowTo","name":"How to Replace the Rear Differential Seal Kit on a Volvo FH / FMX — 20523491","description":"Step-by-step guide for replacing all differential seals, gaskets, and O-rings using the Volvo 20523491 kit.","totalTime":"PT5H","tool":[{"@type":"HowToTool","name":"Socket set and torque wrench"},{"@type":"HowToTool","name":"Seal driver set"},{"@type":"HowToTool","name":"Differential oil drain tray"},{"@type":"HowToTool","name":"Flange holding tool"},{"@type":"HowToTool","name":"Pinion seal puller / slide hammer"}],"step":[{"@type":"HowToStep","position":1,"name":"Drain differential oil and inspect magnetic plug","text":"Position drain tray under the differential; remove drain plug and inspect its magnetic tip for filings. Heavy metallic debris warrants bearing inspection before fitting new seals. Allow full drainage; clean plug and refit with a new O-ring from the kit."},{"@type":"HowToStep","position":2,"name":"Remove propeller shaft and extract pinion seal","text":"Mark the propeller shaft-to-flange orientation; disconnect and support the shaft. Using a flange holding tool, remove the pinion flange nut — discard it, never reuse. Withdraw the flange; use a slide hammer or seal puller to remove the old pinion seal without scoring the housing bore."},{"@type":"HowToStep","position":3,"name":"Remove axle shafts and extract axle shaft seals","text":"Remove rear wheel assemblies; withdraw both axle shafts, collecting all shims in labelled bags — their total thickness must be preserved for correct ring-gear backlash. Use a slide hammer or two-jaw puller to remove old axle shaft seals from the housing bores."},{"@type":"HowToStep","position":4,"name":"Fit new seals from the 20523491 kit","text":"Clean all seal bores; lightly oil seal lips with clean differential oil. Drive axle shaft seals flush or 0.5 mm below housing face using the correct-diameter driver. Press pinion seal squarely using the correct driver — a cocked or hammered-direct seal will fail immediately. Fit all new O-rings lubricated with a smear of petroleum jelly."},{"@type":"HowToStep","position":5,"name":"Reassemble, refill, and road test","text":"Refit axle shafts with all original shims in position. Fit carrier cover with new gasket and torque bolts in a cross pattern. Fit new pinion flange nut and torque to specification — this sets bearing preload. Reconnect propeller shaft. Refill with correct API GL-5 gear oil to level plug. Road test 30 km; re-inspect all seal areas while differential is warm."}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Seals & O-Rings","item":"https://partstrading.com/volvo/seals-orings/"},{"@type":"ListItem","position":4,"name":"20523491","item":"https://partstrading.com/volvo/seals-orings/20523491"}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","logo":"https://partstrading.com/assets/images/logo.png","contactPoint":{"@type":"ContactPoint","contactType":"sales","availableLanguage":["English","Hindi"]}},{"@type":"WebPage","name":"20523491 Differential Seal Kit — Volvo FH FMX FE FM | PTC India","url":"https://partstrading.com/volvo/seals-orings/20523491","speakable":{"@type":"SpeakableSpecification","cssSelector":["h1",".stat-grid",".spec-table"]}}]}</script>

  secs.push(SEC('sec-kit','06','Kit Contents',"What's in the 20523491?",'A four-component sealing system covering every external leak path on the differential housing.',
    '<div class="kit-grid">'

  secs.push(SEC('sec-how','07','Workshop Guide','Replacement Procedure','Full differential seal kit replacement for Volvo FH/FMX — axle shaft seals, pinion seal, gaskets, and O-rings.',
    '<div class="install-step"><div class="step-num">1</div><div class="step-body"><h4>Drain Differential Oil — Inspect Magnetic Plug</h4><p>Position a drain tray with adequate capacity under the differential. Remove the drain plug and inspect its magnetic tip. Light grey metallic sludge is normal; bright silvery chips or fibrous fragments indicate bearing or gear wear that must be investigated before fitting new seals. Allow full drainage; clean the plug and refit with a new O-ring from the kit.</p></div></div>'
    + '<div class="install-step"><div class="step-num">2</div><div class="step-body"><h4>Remove Propeller Shaft — Extract Pinion Seal</h4><p>Mark the propeller shaft-to-flange orientation with paint or a scribe before disconnecting. Remove the propeller shaft and support it. Using a flange-holding tool to prevent rotation, remove the pinion flange nut — this is a prevailing-torque nut, discard it, never reuse. Withdraw the coupling flange. Use a proprietary seal puller or slide hammer with the correct adapter to extract the pinion seal without scoring the housing bore.</p></div></div>'
    + '<div class="install-step"><div class="step-num">3</div><div class="step-body"><h4>Remove Axle Shafts — Extract Axle Shaft Seals</h4><p>Remove the rear wheel and hub assemblies. Withdraw both axle shafts, collecting all shims in labelled bags — their total thickness must be preserved exactly for correct ring-gear backlash on reassembly. Use a slide hammer or two-jaw internal puller to remove the old axle shaft seals from the housing bores. Inspect the shaft journals for wear grooves; a worn journal will cut the new seal lip prematurely.</p></div></div>'
    + '<div class="install-step"><div class="step-num">4</div><div class="step-body"><h4>Fit New Seals from the 20523491 Kit</h4><p>Clean all seal bores with brake cleaner and a lint-free cloth. Lightly oil the seal lips with clean differential oil — never grease. Drive each axle shaft seal squarely to flush or 0.5 mm below the housing face using the correct-diameter driver tube. Press the pinion seal using the correct driver — a cocked or hammered-direct seal will fail immediately. Fit all new O-rings to plugs and sensor bosses, lubricating with petroleum jelly to hold them during assembly.</p></div></div>'
    + '<div class="install-step"><div class="step-num">5</div><div class="step-body"><h4>Reassemble — Refill — Road Test</h4><p>Refit axle shafts with all original shims in their original positions. Fit the carrier cover with the new gasket (or RTV sealant per Volvo specification where no gasket is used) and torque cover bolts in a cross pattern. Fit the new pinion flange nut and torque to the workshop manual specification — this sets pinion bearing preload; do not over- or under-torque. Reconnect and torque the propeller shaft. Refill with correct grade API GL-5 gear oil to the level plug. Road test for 30 km; re-inspect all seal areas for weep while the differential is warm.</p></div></div>'

  secs.push(SEC('sec-faq','09','Questions &amp; Answers','Frequently Asked Questions',null,
    '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">What does Volvo part 20523491 include?</button><div class="faq-a"><p>Volvo 20523491 is a complete differential seal and O-ring kit. It includes both axle shaft seals, the pinion input shaft seal, the differential housing gasket or sealing compound, and an assorted O-ring pack for drain/fill plugs, the breather boss, and sensor ports.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Which Volvo trucks use the 20523491 differential kit?</button><div class="faq-a"><p>The 20523491 is used across the Volvo FH, FMX, FE, and FM Series with Volvo rear axles — including the FH400 and similar configurations. Always confirm the axle type (single-reduction or hub-reduction) from your chassis plate or Volvo IMPACT before ordering.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">How do I know my differential seals have failed?</button><div class="faq-a"><p>Common signs are oil streaks on the inner face of the rear wheels, oil staining on the brake drum or disc, an oil trail directly under the rear axle, or a consistently low differential oil level between service intervals with no obvious puddle.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Can a leaking differential seal contaminate the brakes?</button><div class="faq-a"><p>Yes — this is a serious safety hazard. A failed axle shaft seal allows differential oil to migrate along the axle tube and onto the brake linings or disc. Oil-contaminated brakes have severely reduced friction and can cause brake fade or failure on that wheel. The vehicle must not be driven until seals and brake linings are replaced.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Can I replace just the pinion seal without the full kit?</button><div class="faq-a"><p>You can replace individual seals, but fitting the full 20523491 kit is recommended whenever the differential is apart. All seals have similar service lives; if one has failed, the others are near their limit. The labour to access the differential is the same whether you fit one seal or all of them.</p></div></div>'

    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Do I need to replace the pinion bearing when fitting new seals?</button><div class="faq-a"><p>Not automatically. However, if the magnetic drain plug shows significant metallic debris, or if there is noticeable play or roughness in the pinion flange, the pinion bearings should be inspected and replaced before refitting the new seals.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Can I reuse the pinion flange nut?</button><div class="faq-a"><p>No. The pinion flange nut is a prevailing-torque nut that compresses the pinion bearing stack to the correct preload. Reusing it risks incorrect preload and bearing failure. Always fit a new nut and torque to the value specified in the Volvo workshop manual.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">How long does a differential seal kit replacement take?</button><div class="faq-a"><p>A full kit replacement covering all seals, gaskets, and O-rings typically takes 4–6 hours in a commercial truck workshop. The pinion seal alone takes 1–2 hours. Each axle shaft seal takes approximately 30–45 minutes per side when removed without disturbing the carrier.</p></div></div>'
