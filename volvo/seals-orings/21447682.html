<script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo Timing Gear Cover Gasket — OEM 21447682","description":"Timing gear cover gasket for Volvo D12C, D12D, D16A, D16C engines in FH12 and FH16 heavy trucks. Seals the front timing chest to the engine block face. OEM part number 21447682.","sku":"21447682","mpn":"21447682","brand":{"@type":"Brand","name":"Volvo"},"additionalProperty":[{"@type":"PropertyValue","name":"HSN Code","value":"84841000"},{"@type":"PropertyValue","name":"Gasket Position","value":"Timing Gear Cover — Engine Block Face"},{"@type":"PropertyValue","name":"Engine Application","value":"Volvo D12C, D12D, D16A, D16C"},{"@type":"PropertyValue","name":"Vehicle Application","value":"Volvo FH12, FH16, FM12"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is the Volvo 21447682 timing cover gasket?","acceptedAnswer":{"@type":"Answer","text":"The Volvo 21447682 is the gasket that seals the front timing gear cover to the engine block on Volvo D12 and D16 series engines. It prevents engine oil from leaking at the joint between the cast timing chest and the engine block mating face."}},{"@type":"Question","name":"Which Volvo engines use the 21447682 gasket?","acceptedAnswer":{"@type":"Answer","text":"The 21447682 is used on Volvo D12C, D12D, D16A, and D16C engines as fitted in the FH12, FH16, and FM12 truck ranges. Always confirm the application against your engine serial number or via Volvo IMPACT before ordering."}},{"@type":"Question","name":"What are the symptoms of a leaking timing cover gasket?","acceptedAnswer":{"@type":"Answer","text":"The most common symptom is an oil weep or film on the front face of the engine, often visible on the engine block below the timing cover joint. In more advanced cases, oil may drip onto the exhaust manifold or front crossmember causing a burning oil smell. Oil consumption without an obvious external puddle can also indicate a slow leak here."}},{"@type":"Question","name":"Should I use sealant with the 21447682 gasket?","acceptedAnswer":{"@type":"Answer","text":"The 21447682 is typically fitted dry. However, Volvo workshop manuals for some D12/D16 variants specify a small bead of anaerobic sealant at the oil-pan-to-block corner where three surfaces meet. Always follow your specific engine's workshop manual — do not apply sealant across the full gasket face."}},{"@type":"Question","name":"Should I replace the crankshaft front seal at the same time?","acceptedAnswer":{"@type":"Answer","text":"Yes — the crankshaft front oil seal is located inside the timing cover. Since the cover must be removed to replace the gasket, fitting a new crankshaft front seal at the same time adds minimal cost but eliminates the risk of having to repeat the entire job shortly afterwards if the front seal weeps."}},{"@type":"Question","name":"What causes a timing cover gasket to fail?","acceptedAnswer":{"@type":"Answer","text":"Common causes are heat cycling over high mileage causing the gasket to lose its compressive recovery, incorrect torque on cover bolts causing uneven sealing pressure, surface corrosion on the aluminium cover or cast-iron block face preventing full contact, and incorrect coolant inhibitor causing electrochemical attack on the block face near coolant passages."}},{"@type":"Question","name":"What torque should I use on the timing cover bolts?","acceptedAnswer":{"@type":"Answer","text":"Torque values for timing cover bolts vary by bolt diameter and engine variant; always follow the specific torque sequence and values in the Volvo D12 or D16 workshop manual. Applying bolts in the correct star pattern is as important as the torque value — random tightening causes uneven gasket compression and localised leaks."}},{"@type":"Question","name":"Can I replace the timing cover gasket without removing the engine?","acceptedAnswer":{"@type":"Answer","text":"Yes — the timing cover gasket can be replaced in the vehicle. The engine does not need to be removed. However, access requires removing the front bumper, cooling pack, drive belts, fan assembly, coolant pump, and vibration damper. On FH12/FH16 with a tilting cab, cab tilt gives adequate access from above."}},{"@type":"Question","name":"How long does a timing cover gasket replacement take?","acceptedAnswer":{"@type":"Answer","text":"In a well-equipped commercial truck workshop, a timing cover gasket replacement on a Volvo FH12 or FH16 takes approximately 5–8 hours including ancillary removal, surface preparation, reassembly, and a post-run inspection for weep. Simultaneous replacement of the crankshaft front seal, coolant pump, and drive belts is recommended to maximise the value of the disassembly."}},{"@type":"Question","name":"Is PTC's 21447682 an OEM-quality gasket?","acceptedAnswer":{"@type":"Answer","text":"Yes. Parts Trading Company supplies OEM-specification 21447682 gaskets manufactured to Volvo's original material and dimensional specification. All gaskets are dispatched from Mumbai with same-day shipping available and a 60-minute WhatsApp price quote guaranteed."}}]},{"@type":"HowTo","name":"How to Replace the Timing Gear Cover Gasket on a Volvo FH12 / FH16 — 21447682","description":"Step-by-step guide for replacing the timing gear cover gasket on Volvo D12 and D16 engines.","totalTime":"PT7H","tool":[{"@type":"HowToTool","name":"Socket set and torque wrench"},{"@type":"HowToTool","name":"Drive belt tension tool"},{"@type":"HowToTool","name":"Coolant drain tray"},{"@type":"HowToTool","name":"Plastic scraper (not metal)"},{"@type":"HowToTool","name":"Brake cleaner and lint-free cloths"},{"@type":"HowToTool","name":"Vibration damper puller"}],"step":[{"@type":"HowToStep","position":1,"name":"Remove front ancillaries to expose timing chest","text":"Tilt the cab for access. Remove the poly-V drive belt(s) and tension the idler clear. Remove the fan assembly and fan clutch. Drain coolant below the coolant pump level; remove the coolant pump and housing. Remove the vibration damper using a puller — do not strike the crankshaft nose. This exposes the full face of the timing gear cover."},{"@type":"HowToStep","position":2,"name":"Remove timing cover bolts and lift the cover","text":"Remove all timing cover bolts in a reverse star pattern starting from the outer edges and working inward — this releases clamping force evenly and prevents cover distortion. Break the cover loose with a soft mallet on a wooden block; never lever against the gasket seating faces as this damages the aluminium cover and block face."},{"@type":"HowToStep","position":3,"name":"Clean mating surfaces thoroughly","text":"Clean both the timing cover face and engine block face with a plastic scraper — metal scrapers will score the aluminium cover. Degrease with brake cleaner on a lint-free cloth. Inspect both surfaces for corrosion pits or raised burrs; minor imperfections can be lapped flat with fine emery on a surface plate. Any significant pitting must be assessed before refitting."},{"@type":"HowToStep","position":4,"name":"Fit the new 21447682 gasket","text":"Position the 21447682 gasket dry on the engine block face — no sealant is applied across the face of this gasket. Where the Volvo workshop manual for your engine variant specifies it, apply a 2–3 mm bead of anaerobic sealant only at the corner where the oil pan gasket, block face, and timing cover gasket meet. Ensure the gasket locates correctly on any alignment dowels before fitting the cover."},{"@type":"HowToStep","position":5,"name":"Refit cover, reassemble ancillaries, and verify","text":"Refit the timing cover; start all bolts by hand. Torque to specification in the star pattern — centre bolts first, working outward in two passes to the final torque. Refit the crankshaft front seal if being replaced simultaneously. Refit vibration damper, coolant pump, fan assembly, and drive belt(s) to correct tension. Refill coolant. Start the engine and run to full operating temperature; inspect the timing cover joint for any weep while warm."}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Seals & O-Rings","item":"https://partstrading.com/volvo/seals-orings/"},{"@type":"ListItem","position":4,"name":"21447682","item":"https://partstrading.com/volvo/seals-orings/21447682"}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","logo":"https://partstrading.com/assets/images/logo.png","contactPoint":{"@type":"ContactPoint","contactType":"sales","availableLanguage":["English","Hindi"]}},{"@type":"WebPage","name":"21447682 Timing Gear Cover Gasket — Volvo FH12 FH16 D12 D16 | PTC India","url":"https://partstrading.com/volvo/seals-orings/21447682","speakable":{"@type":"SpeakableSpecification","cssSelector":["h1",".stat-grid",".spec-table"]}}]}</script>

    '<p style="font-size:0.95rem;color:#bbb;line-height:1.8;margin-bottom:16px;">Volvo part number <strong style="color:#FFB81C;">21447682</strong> is the timing gear cover gasket for Volvo D12 and D16 series diesel engines. It is a flat composite seal interposed between the front timing chest casting and the engine block front face, enclosing the full Volvo D-series gear train within an oil-tight cavity.</p>'

  secs.push(SEC('sec-fail','05','Diagnosis','Failure Symptoms','Signs that the timing cover gasket on your Volvo D12 or D16 needs replacement.',
    '<div class="symptom-item">'
    + '<div class="s-warn">&#9651;</div>'
    + '<div><strong style="color:#F0ECE6;font-size:0.92rem;">Oil weep at the front face of the engine</strong><p style="font-size:0.85rem;color:#999;margin-top:4px;line-height:1.6;">A film or trail of engine oil on the engine block face below the timing cover joint is the primary indicator. The leak is often most visible after a hot run when the engine has been switched off and oil pressure is lost — oil seeps through the joint under gravity.</p></div>'

  secs.push(SEC('sec-timing','06','Engine Architecture','What the Timing Chest Seals','Four systems rely on the 21447682 to keep their lubricating oil internal.',
    '<div class="timing-grid">'
    + '<div class="timing-card card-shine"><div class="timing-icon">&#9965;</div><div class="timing-name">Crankshaft Front Gear</div><div class="timing-desc">The crankshaft nose gear is the root of the entire D12/D16 timing drive. It meshes with the idler gear cluster at the front of the engine. The timing chest encases this gear and the pressurised oil lubrication film on the gear teeth. The 21447682 gasket seals the chest to the block face at crankshaft centreline level.</div></div>'
    + '<div class="timing-card card-shine"><div class="timing-icon">&#9881;</div><div class="timing-name">Idler &amp; Accessory Drives</div><div class="timing-desc">The D-series timing chest contains the complete gear train: primary idler, air compressor drive gear, and hydraulic pump drive. These gears are fed pressurised oil from the main engine oiling circuit. The timing chest is therefore under engine oil pressure — any joint failure allows oil to escape externally.</div></div>'
    + '<div class="timing-card card-shine"><div class="timing-icon">&#8645;</div><div class="timing-name">Camshaft Drive</div><div class="timing-desc">The camshaft drive arrangement (gear or chain-and-gear depending on D12 variant) operates within the timing chest. High-speed gear meshing generates oil misting inside the chest. The gasket must prevent this oil mist, which is under slight positive pressure, from seeping through the cover-to-block joint during sustained high-speed operation.</div></div>'
    + '<div class="timing-card card-shine"><div class="timing-icon">&#9673;</div><div class="timing-name">Crankshaft Front Oil Seal</div><div class="timing-desc">The crankshaft front oil seal is housed within the timing cover itself. This seal runs on the crankshaft nose journal and is a separate part from the 21447682 gasket. However, since the cover must be removed to replace the gasket, it is best practice to replace both simultaneously — the crankshaft nose journal is exposed for inspection at this time.</div></div>'
    + '</div>'

  secs.push(SEC('sec-how','07','Workshop Guide','Replacement Procedure','Timing gear cover gasket replacement on Volvo FH12 / FH16 — in-vehicle, without engine removal.',
    '<div class="install-step"><div class="step-num">1</div><div class="step-body"><h4>Remove Front Ancillaries to Expose Timing Chest</h4><p>Tilt the cab for overhead access. Release the poly-V belt(s) and remove them along with the belt tensioner. Remove the fan and fan clutch. Drain coolant below the coolant pump inlet; remove the coolant pump and its housing. Remove the vibration damper from the crankshaft nose using a proprietary puller — do not strike the crankshaft. With these components cleared, the full face of the timing cover is accessible.</p></div></div>'
    + '<div class="install-step"><div class="step-num">2</div><div class="step-body"><h4>Remove Timing Cover Bolts and Lift Cover Clear</h4><p>Remove all timing cover bolts in a reverse star pattern — start at the outer edges and work inward. This releases clamping load evenly and prevents cover distortion. Break the cover free with a soft mallet on a hardwood block against the casting; never prise a metal lever against the seating face. Lift the cover away carefully so as not to damage the crankshaft front seal bore if the seal is being reused.</p></div></div>'
    + '<div class="install-step"><div class="step-num">3</div><div class="step-body"><h4>Prepare Both Mating Surfaces</h4><p>Remove all traces of the old gasket from both the timing cover face and the engine block face using a plastic scraper only — metal tools score aluminium. Degrease both faces with brake cleaner on a lint-free cloth. Inspect for corrosion, raised burrs, or impact damage. Minor surface imperfections can be lapped flat on a surface plate with 400-grit emery. Any significant pitting in a coolant passage area must be assessed for the risk of coolant ingress into the oil circuit.</p></div></div>'
    + '<div class="install-step"><div class="step-num">4</div><div class="step-body"><h4>Position the New 21447682 Gasket</h4><p>Fit the new 21447682 gasket dry onto the engine block face, locating it over any alignment dowels. Where your engine\'s specific workshop manual calls for it, apply a small bead of anaerobic sealant (2–3 mm diameter) only at the junction where the oil pan gasket, engine block, and timing cover all meet — this three-way corner is the only point where additional sealant is typically specified. Do not apply sealant across the full gasket face.</p></div></div>'
    + '<div class="install-step"><div class="step-num">5</div><div class="step-body"><h4>Refit Cover, Reassemble Ancillaries, Verify</h4><p>Lower the timing cover onto the gasket and start all bolts by hand. Torque to the specification in your workshop manual in a star pattern — centre first, working outward, in at least two torque passes to the final value. Refit the coolant pump, vibration damper (new bolt if specified), fan assembly, and drive belt(s) at correct tension. Refill coolant. Run the engine to full operating temperature; inspect the timing cover joint for any weep while warm. A short high-speed road run followed by a parked inspection confirms zero leakage under pressure.</p></div></div>'

  secs.push(SEC('sec-faq','09','Questions &amp; Answers','Frequently Asked Questions',null,
    '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">What is the Volvo 21447682 timing cover gasket?</button><div class="faq-a"><p>The Volvo 21447682 is the gasket that seals the front timing gear cover to the engine block on Volvo D12 and D16 series engines. It prevents engine oil from leaking at the joint between the cast timing chest and the engine block front face.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Which Volvo engines use the 21447682 gasket?</button><div class="faq-a"><p>The 21447682 is used on Volvo D12C, D12D, D16A, and D16C engines as fitted in the FH12, FH16, and FM12 truck ranges. Always confirm the application against your engine serial number via Volvo IMPACT before ordering.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">What are the symptoms of a leaking timing cover gasket?</button><div class="faq-a"><p>The most common symptom is an oil weep or film on the front face of the engine below the timing cover joint. More advanced cases show oil dripping onto exhaust components (fire risk) or burning off as blue smoke. Unexplained oil consumption without a visible puddle can also indicate a slow seeping leak here.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Should I use sealant with the 21447682 gasket?</button><div class="faq-a"><p>The 21447682 is typically fitted dry. Volvo workshop manuals for some D12/D16 variants specify a small bead of anaerobic sealant only at the three-way corner where the oil pan gasket, block, and timing cover meet. Do not apply sealant across the full gasket face — follow your engine\'s specific workshop manual.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Should I replace the crankshaft front seal at the same time?</button><div class="faq-a"><p>Yes — strongly recommended. The crankshaft front oil seal sits inside the timing cover. Since the cover must come off to replace the gasket, fitting a new front seal adds minimal time and cost but eliminates the risk of repeating the full ancillary disassembly if the front seal weeps shortly afterwards.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">What causes a timing cover gasket to fail?</button><div class="faq-a"><p>Common causes: heat cycling over high mileage causes loss of compressive recovery; incorrect bolt torque creates uneven sealing pressure; surface corrosion on the aluminium cover or cast-iron block prevents full gasket contact; incorrect coolant inhibitor causes electrochemical attack near coolant passages. Oil degradation from extended drain intervals accelerates gasket material breakdown.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">What torque should I use on the timing cover bolts?</button><div class="faq-a"><p>Torque values vary by bolt diameter and engine variant. Always use the specific torque sequence and values from the Volvo D12 or D16 workshop manual for your engine variant. Applying bolts in the correct star pattern is as important as the torque value — random tightening causes uneven gasket compression and localised weeps.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">Can I replace the timing cover gasket without removing the engine?</button><div class="faq-a"><p>Yes — the engine does not need to be removed. The job is done in-vehicle with the cab tilted. Access requires removing the front bumper or cooling pack on some configurations, plus drive belts, fan, coolant pump, and vibration damper. On FH12/FH16 with a tilting cab, access from above is straightforward.</p></div></div>'
    + '<div class="faq-item"><button class="faq-q" onclick="toggleFaq(this)">How long does a timing cover gasket replacement take?</button><div class="faq-a"><p>In a well-equipped commercial truck workshop, the job takes approximately 5–8 hours including ancillary removal, surface preparation, gasket fitting, reassembly, and a post-run inspection. Fitting a new crankshaft front seal, coolant pump, and drive belts simultaneously is recommended to maximise the value of the disassembly time.</p></div></div>'
