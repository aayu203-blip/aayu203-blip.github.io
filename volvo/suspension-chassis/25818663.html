  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX500 / FMX460 Propeller Shaft 25818663","alternateName":["Volvo 25818663 Front Driveshaft","FMX500 Propeller Shaft 25818663","Volvo FMX Front Propshaft 25818663","Volvo FMX Driveshaft 25818663"],"description":"OEM-specification front propeller shaft for Volvo FMX500 and FMX460 trucks. Tubular steel construction with splined yokes at both ends and a sliding sleeve yoke to accommodate suspension travel. Transmits torque from gearbox output flange to the centre bearing. Fits FMX330, FMX370, FMX440, FMX460, FMX500, FMX540 — verify with gearbox type and wheelbase. Grease every 20,000 km. Replace if run-out exceeds 0.3mm or yoke ear-to-ear play exceeds 0.1mm.","mpn":"25818663","sku":"25818663","image":["https://partstrading.com/assets/images/parts/suspension.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"25818663"},{"@type":"PropertyValue","name":"Part Type","value":"Front Propeller Shaft (Driveshaft)"},{"@type":"PropertyValue","name":"Material","value":"Tubular steel with forged steel yokes"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX330, FMX370, FMX440, FMX460, FMX500, FMX540"},{"@type":"PropertyValue","name":"OAL","value":"Approx. 1,400–1,600 mm (wheelbase dependent)"},{"@type":"PropertyValue","name":"Grease Nipples","value":"2 × universal joints — NLGI 2 EP grease every 20,000 km"},{"@type":"PropertyValue","name":"Max Run-out","value":"0.3 mm at mid-point (dial gauge)"},{"@type":"PropertyValue","name":"Max Yoke Play","value":"0.1 mm ear-to-ear"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}],"offers":{"@type":"Offer","availability":"https://schema.org/InStock","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Suspension & Chassis","item":"https://partstrading.com/volvo/suspension-chassis/"},{"@type":"ListItem","position":4,"name":"25818663 Propeller Shaft","item":"https://partstrading.com/volvo/suspension-chassis/25818663"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 25818663?","acceptedAnswer":{"@type":"Answer","text":"Part 25818663 is the front propeller shaft (driveshaft) for Volvo FMX trucks. It transmits torque from the gearbox output flange to the centre bearing assembly (23707800), which then passes drive to the rear axle via a second shaft. The shaft is tubular steel with splined yokes at both ends and a sliding sleeve yoke to accommodate suspension travel."}},{"@type":"Question","name":"What Volvo FMX models does 25818663 fit?","acceptedAnswer":{"@type":"Answer","text":"Part 25818663 fits FMX330, FMX370, FMX440, FMX460, FMX500, and FMX540 — both I-Shift and manual gearbox variants. Always verify against your specific gearbox type and wheelbase, as shaft length varies. Provide your chassis VIN when ordering."}},{"@type":"Question","name":"When should I replace propeller shaft 25818663?","acceptedAnswer":{"@type":"Answer","text":"Replace when: run-out at the mid-point of the shaft exceeds 0.3mm (measured with a dial gauge and the shaft spinning slowly); yoke ear-to-ear play exceeds 0.1mm; universal joints are stiff, dry, or have visible rust on the bearing caps; sliding yoke splines show more than 0.5mm backlash; or if the shaft shows visible cracks, dents, or corrosion damage."}},{"@type":"Question","name":"How do I measure propeller shaft run-out?","acceptedAnswer":{"@type":"Answer","text":"Support the shaft in V-blocks or with the vehicle raised and shaft in-situ. Mount a dial gauge at the mid-point of the shaft tube. Rotate the shaft slowly by hand. Total indicator reading (TIR) must not exceed 0.3mm. A run-out above this value indicates bending from impact damage or uneven material loss — the shaft must be replaced or professionally balanced."}},{"@type":"Question","name":"How often should I grease propeller shaft 25818663?","acceptedAnswer":{"@type":"Answer","text":"Grease both universal joint nipples every 20,000 km using NLGI 2 EP (extreme pressure) grease. Most FMX propeller shafts have two grease nipples — one per universal joint cross. Also grease the sliding sleeve splines with CV joint or universal joint grease at each shaft removal. Under-greasing is the most common cause of premature universal joint failure."}},{"@type":"Question","name":"What is the sliding yoke on propeller shaft 25818663?","acceptedAnswer":{"@type":"Answer","text":"The sliding yoke (also called the sleeve yoke or slip yoke) is a splined internal sleeve that allows the shaft to change effective length as the suspension moves up and down. Without it, the changing geometry between gearbox and centre bearing would over-stress the universal joints. The splines must be kept greased — dry splines cause clunking on acceleration and deceleration and accelerate spline wear."}},{"@type":"Question","name":"What causes propeller shaft vibration on the Volvo FMX?","acceptedAnswer":{"@type":"Answer","text":"Main causes: (1) Worn universal joint bearings — dry or pitted needle rollers cause vibration that increases with road speed; (2) Shaft imbalance — from dents, mud accumulation, or incorrect repair; (3) Excessive run-out — bent shaft; (4) Worn sliding yoke splines — causes vibration on drive and overrun; (5) Loose companion flange bolts at either end. Vibration from a shaft issue typically varies with road speed rather than engine rpm."}},{"@type":"Question","name":"What other parts should I inspect when replacing 25818663?","acceptedAnswer":{"@type":"Answer","text":"Always inspect: 23707800 (centre bearing) — worn bearing causes the same vibration symptoms; 21081177 (companion flange at differential) — check spline backlash and face runout; 22728175 (sliding sleeve yoke) — inspect spline condition; both universal joint crosses — replace if pitted or stiff."}},{"@type":"Question","name":"Does balancing matter when replacing the FMX propeller shaft?","acceptedAnswer":{"@type":"Answer","text":"Yes. The FMX front propeller shaft operates at high speed and any imbalance causes vibration at drivetrain-speed frequencies. When fitting a replacement shaft, always fit the companion flange and yoke in the same angular position as marked during removal. If a new shaft is fitted, dynamic balancing on a propeller shaft balancer is recommended. Never weld repair a bent shaft without rebalancing."}},{"@type":"Question","name":"Can I replace universal joints on 25818663 without replacing the full shaft?","acceptedAnswer":{"@type":"Answer","text":"In many cases, universal joint crosses can be replaced if the shaft tube is undamaged and the yoke ears are not worn or cracked. However, if the shaft has been running dry for extended periods, the yoke ear bores may be bell-mouthed — a worn bore will destroy new universal joints quickly. Measure bore diameter before fitting new joints. If the shaft is bent or severely corroded, replace the full assembly."}},{"@type":"Question","name":"Can PTC supply 25818663 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Propeller shafts are packaged in reinforced tubes to prevent transit damage. Airfreight for urgent orders. Full export documentation provided."}},{"@type":"Question","name":"Is 25818663 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket propeller shafts for 25818663 manufactured to Volvo's original tube diameter, wall thickness, yoke specification, and balance tolerance. Genuine Volvo units are available on request. For the drivetrain application, quality matters — a shaft with incorrect balance or undersize yoke bearing pockets causes rapid universal joint wear."}}]},{"@type":"HowTo","name":"How to Grease Volvo FMX Propeller Shaft 25818663 Universal Joints","totalTime":"PT30M","step":[{"@type":"HowToStep","position":1,"name":"Prepare — lift and make shaft accessible","text":"Raise vehicle on stands or use an inspection pit. Apply park brake, chock front wheels. Rotate the propeller shaft to access each grease nipple in turn."},{"@type":"HowToStep","position":2,"name":"Locate the two grease nipples","text":"Propeller shaft 25818663 has one grease nipple per universal joint cross — two total. They are on the cross spider body, visible between the yoke ears. Clean each nipple with a rag before attaching the grease gun."},{"@type":"HowToStep","position":3,"name":"Apply NLGI 2 EP grease","text":"Fit grease gun to nipple. Pump grease slowly until fresh grease appears from the needle roller seal on all four trunnion caps — typically 3–6 pumps. Do not over-pump: excessive pressure can blow the seal cups off the caps. Wipe away excess grease."},{"@type":"HowToStep","position":4,"name":"Record mileage and set next service reminder","text":"Note current odometer. Next greasing due at 20,000 km. In severe off-highway operation, halve this interval to 10,000 km."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX500 / FMX460 Propeller Shaft 25818663","url":"https://partstrading.com/volvo/suspension-chassis/25818663","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>

  var secWhat=SEC('sec-what','01','Drivetrain','What Is the Propeller Shaft 25818663?',

    ['How often should I grease propeller shaft universal joints?','Grease both universal joint nipples every 20,000 km with NLGI 2 EP grease. In severe off-highway use, halve this interval to 10,000 km. Pump until fresh grease appears from all four trunnion cap seals — this confirms all needle rollers are receiving lubricant.'],
    ['What causes propeller shaft vibration on the Volvo FMX?','Speed-dependent vibration (not related to engine rpm) from the drivetrain is typically caused by: worn universal joint bearings; shaft imbalance from dents or mud accumulation; excessive run-out; worn sliding sleeve splines; or loose flange bolts. Check in this order.'],
    ['Does the sliding sleeve yoke come with the propeller shaft?','The sliding sleeve yoke (part 22728175) may or may not be included depending on the supply configuration — confirm when ordering. The sleeve yoke is also available separately. Inspect spline condition — if play exceeds 0.5mm replace the sleeve yoke at the same time as the shaft.'],
    ['Why is balancing important for the FMX propeller shaft?','The shaft rotates at high speed and any imbalance generates vibration that increases with vehicle speed. When refitting the same shaft, mark the angular relationship between tube and yokes before disassembly — refitting in the same phase preserves original balance. New shafts arrive pre-balanced.'],
    ['Can I weld repair a bent FMX propeller shaft?','No, without rebalancing on a dynamic propeller shaft balancer. Welding on balance weights or straightening a shaft without subsequent dynamic balancing will leave residual imbalance that causes vibration. Replace the shaft or take it to a specialist propeller shaft repair facility.'],
    ['What other parts should I replace with 25818663?','Inspect: 23707800 (centre bearing) — replace if vibration or rumbling at 60–120 km/h; 22728175 (sliding sleeve yoke) — replace if spline play exceeds 0.5mm; 21081177 (companion flange at diff) — check runout and spline backlash. Universal joint crosses — replace if pitted or stiff.'],
    ['Can PTC supply 25818663 to UAE, Nigeria, or Kenya?','Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Propeller shafts are packaged in reinforced tubes for transit. Airfreight available for urgent orders.'],
