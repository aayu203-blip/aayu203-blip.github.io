  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX500 Bogie Cradle Bushing 22717828","alternateName":["Volvo 22717828 Bogie Bush","FMX500 Cradle Bush 22717828","Volvo FMX Bogie Pivot Bushing","Volvo Tandem Axle Cradle Bush 22717828"],"description":"OEM-specification rubber-bonded steel bogie cradle bushing for Volvo FMX500, FMX460, FM Gen4, and FH Gen4 trucks with tandem rear axle (bogie) arrangement. Mounts at the central pivot point of the bogie cradle beam. Absorbs torsional and vertical loads from both rear drive axles during travel over rough terrain. Replace in pairs — LH and RH simultaneously.","mpn":"22717828","sku":"22717828","image":["https://partstrading.com/assets/images/parts/suspension.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"22717828"},{"@type":"PropertyValue","name":"Part Type","value":"Bogie Cradle Bushing"},{"@type":"PropertyValue","name":"Material","value":"Vulcanized rubber bonded to steel inner and outer sleeves"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX500, FMX460, FM Gen4, FH Gen4 — tandem rear axle"},{"@type":"PropertyValue","name":"Replacement Quantity","value":"Replace in pairs — LH and RH"},{"@type":"PropertyValue","name":"Location","value":"Bogie cradle beam central pivot point"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}],"offers":{"@type":"Offer","availability":"https://schema.org/InStock","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Suspension & Chassis","item":"https://partstrading.com/volvo/suspension-chassis/"},{"@type":"ListItem","position":4,"name":"22717828 Bogie Cradle Bushing","item":"https://partstrading.com/volvo/suspension-chassis/22717828"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 22717828?","acceptedAnswer":{"@type":"Answer","text":"Part 22717828 is the bogie cradle bushing for Volvo FMX500 and FMX460 trucks with tandem rear axle (bogie) configuration. It is a rubber-bonded steel bush that mounts at the central pivot point of the bogie cradle beam, allowing the beam to articulate and distribute load across both rear drive axles while absorbing vibration and shock."}},{"@type":"Question","name":"What is a bogie cradle bushing and why does it fail?","acceptedAnswer":{"@type":"Answer","text":"The bogie cradle bushing sits at the pivot point of the tandem rear axle beam. Rubber degrades from heat cycling, constant torsional loading, chemical exposure, and age. Overloading beyond GVW accelerates failure. Typical lifespan: 300,000–500,000 km in normal operation, much less in construction or off-road use."}},{"@type":"Question","name":"What are the symptoms of a worn bogie bushing 22717828?","acceptedAnswer":{"@type":"Answer","text":"Early: faint clunking or double-knock sound from rear bogie on rough terrain. Mid-stage: visible rubber cracking or extrusion from steel sleeve ends, louder knock, slight wander under heavy load. Advanced: significant lateral play at pivot point, uneven rear tyre wear, continuous knock audible to driver. Inspect by prying at the cradle pivot — more than 2–3mm movement indicates replacement is due."}},{"@type":"Question","name":"How many bogie bushings does a Volvo FMX500 need?","acceptedAnswer":{"@type":"Answer","text":"The standard 6×4 FMX500 bogie uses 2 cradle bushings per vehicle — one on each side of the pivot bracket (LH and RH). Always replace both simultaneously. If you replace only the worn side, the truck will develop the same handling issue within a short period as the second bush reaches the end of its life."}},{"@type":"Question","name":"Can I replace bogie bushing 22717828 without removing the axle?","acceptedAnswer":{"@type":"Answer","text":"Yes, in most cases the bogie cradle bush can be replaced with both rear axles in place, but the cradle beam must be fully unloaded. The pivot bolt (993079) must be removed, the cradle lowered, old bushings pressed out, new bushings pressed in, and the cradle reassembled. A hydraulic press is required."}},{"@type":"Question","name":"What tools are needed to replace 22717828?","acceptedAnswer":{"@type":"Answer","text":"Required: hydraulic workshop press (min 10-tonne), suitable press adapters, vehicle hoist or axle stands, breaker bar for pivot bolt, torque wrench calibrated to 300+ Nm. Replace cradle bolt 993079 and nut 984405 at the same time."}},{"@type":"Question","name":"What other parts should I replace with the bogie bushing?","acceptedAnswer":{"@type":"Answer","text":"Best practice: replace cradle bolt 993079 and nut 984405 at every bushing replacement — these are torque-to-yield fasteners. Also inspect the pivot bracket bore for wear ovality. Always replace bogie bushings in pairs."}},{"@type":"Question","name":"How do I inspect bogie bushings without removing them?","acceptedAnswer":{"@type":"Answer","text":"Visual: check bush ends for rubber extrusion or cracking. Physical: with truck on stands and bogie unloaded, use a pry bar at the pivot — more than 2–3mm movement confirms wear. Abnormal tyre wear on one rear axle indicates one-sided bushing collapse."}},{"@type":"Question","name":"Does 22717828 fit FMX460 as well as FMX500?","acceptedAnswer":{"@type":"Answer","text":"Part 22717828 fits both Volvo FMX500 and FMX460 variants with bogie rear axle, as well as FM Gen4 and FH Gen4 6×4 configurations. Always verify fitment against your chassis serial number."}},{"@type":"Question","name":"What is the torque for the bogie pivot bolt on FMX500?","acceptedAnswer":{"@type":"Answer","text":"Pivot bolt 993079: initial torque to ~200 Nm, then angle-tighten a further 90°. Always consult the Volvo WTM for your specific chassis. Never reuse a pivot bolt — always fit new 993079 and 984405."}},{"@type":"Question","name":"Can PTC supply 22717828 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Airfreight available for urgent orders."}},{"@type":"Question","name":"Is the 22717828 bushing OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket bogie cradle bushings for 22717828, manufactured to Volvo's original rubber hardness, bonding specification, and steel sleeve dimensions. Genuine Volvo units available on request."}}]},{"@type":"HowTo","name":"How to Replace Volvo FMX500 Bogie Cradle Bushing 22717828","totalTime":"PT4H","step":[{"@type":"HowToStep","position":1,"name":"Prepare vehicle and support bogie","text":"Park on level ground. Support chassis on heavy-duty stands — bogie must be fully unloaded. Place a jack under the cradle beam. Apply park brake and chock front wheels."},{"@type":"HowToStep","position":2,"name":"Remove pivot bolt and lower cradle","text":"Remove pivot bolt 993079 and nut 984405. Slowly lower jack to allow cradle to drop clear of pivot bracket. Discard bolt and nut — never reuse torque-to-yield fasteners."},{"@type":"HowToStep","position":3,"name":"Press out worn bushings","text":"Place cradle in hydraulic press. Press out worn bushings using correctly sized adapters. Inspect pivot bore for scoring or ovality before fitting new bushings."},{"@type":"HowToStep","position":4,"name":"Press in new bushings 22717828","text":"Apply light rubber lubricant to outer sleeve. Press new bushings squarely into bore using press and adapter. Bush must seat flush or just below the bore face."},{"@type":"HowToStep","position":5,"name":"Refit cradle and torque new pivot bolt","text":"Raise cradle into pivot bracket. Fit new bolt 993079 and nut 984405. Torque to Volvo WTM specification: ~200 Nm initial + 90° angle tighten."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX500 Bogie Cradle Bushing 22717828","url":"https://partstrading.com/volvo/suspension-chassis/22717828","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>
