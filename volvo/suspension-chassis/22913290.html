  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX500 Bogie Cradle Assembly 22913290","alternateName":["Volvo 22913290 Bogie Cradle","FMX500 Bogie Assembly 22913290","Volvo FMX Tandem Axle Cradle","Volvo FMX500 Bogie Beam 22913290"],"description":"OEM-specification bogie cradle assembly for Volvo FMX500 and FMX460 trucks with tandem rear axle. Fabricated steel beam that connects both rear drive axles at the bogie pivot point, distributing load equally across both axles and allowing independent articulation over rough terrain. Replaces the full cradle structure when cracked, bent, or when pivot bore is worn beyond bushing specification. Replace cradle bushings 22717828 whenever the cradle assembly is replaced.","mpn":"22913290","sku":"22913290","image":["https://partstrading.com/assets/images/parts/suspension.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"22913290"},{"@type":"PropertyValue","name":"Part Type","value":"Bogie Cradle Assembly"},{"@type":"PropertyValue","name":"Material","value":"Fabricated structural steel — weld construction"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX500, FMX460 — tandem rear axle (bogie) 6×4"},{"@type":"PropertyValue","name":"Failure Modes","value":"Fatigue cracking at pivot eye welds, deformation from overloading"},{"@type":"PropertyValue","name":"Replace With","value":"Cradle Bushings 22717828, Pivot Bolt 993079, Nut 984405"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Suspension & Chassis","item":"https://partstrading.com/volvo/suspension-chassis/"},{"@type":"ListItem","position":4,"name":"22913290 Bogie Cradle Assembly","item":"https://partstrading.com/volvo/suspension-chassis/22913290"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 22913290?","acceptedAnswer":{"@type":"Answer","text":"Part 22913290 is the bogie cradle assembly for Volvo FMX500 and FMX460 trucks with tandem rear axle configuration. It is the fabricated steel beam that physically connects both rear drive axles at the bogie pivot point, distributing load equally and allowing each axle to articulate independently on rough terrain. It is replaced when cracked at weld zones, bent from overloading, or when the pivot bore is worn beyond the bushing specification."}},{"@type":"Question","name":"What is the difference between 22913290 and 22717828?","acceptedAnswer":{"@type":"Answer","text":"Part 22913290 is the structural bogie cradle assembly — the full fabricated steel beam that connects both rear axles. Part 22717828 is the rubber-bonded steel bushing that fits inside the cradle pivot eye. They are different components. When replacing the cradle assembly (22913290), always fit new bushings (22717828) at the same time. Bushing replacement (22717828) can be done without replacing the cradle, unless the pivot bore is damaged."}},{"@type":"Question","name":"When do I need to replace the bogie cradle assembly 22913290 rather than just the bushings?","acceptedAnswer":{"@type":"Answer","text":"You need to replace the full cradle assembly (22913290) when: (1) visible cracking is found at the pivot eye welds or main beam welds — confirmed by dye penetrant or magnetic particle inspection; (2) the cradle beam is visibly bent or deformed from impact or overloading; (3) the pivot bore is worn to an oversized diameter that cannot accommodate new bushings without running loose; (4) corrosion has compromised structural integrity of the beam."}},{"@type":"Question","name":"What are the symptoms of a damaged bogie cradle assembly?","acceptedAnswer":{"@type":"Answer","text":"Severe clunking or banging from rear bogie that persists even after bushing replacement; visible diagonal twist in the rear of the vehicle on flat ground; one rear axle visibly higher or lower than the other; weld cracking visible around the pivot eye; truck rocks diagonally at low speed ('rocking horse' effect) on level ground; handling instability and inability to hold a straight line under full load."}},{"@type":"Question","name":"How do I inspect the bogie cradle for cracks?","acceptedAnswer":{"@type":"Answer","text":"Start with visual inspection — look at all weld zones, especially around the pivot eye and where the main beam meets the axle mounting faces. Clean the area thoroughly. For definitive inspection, apply dye penetrant: spray developer, allow to dry, then apply penetrant and inspect under UV or normal light for crack indications. Magnetic particle inspection (MPI) is the most reliable method if equipment is available. Pay particular attention to the pivot eye weld toes where fatigue cracks initiate."}},{"@type":"Question","name":"Can the bogie cradle assembly be repaired rather than replaced?","acceptedAnswer":{"@type":"Answer","text":"Minor surface cracks in non-structural locations can sometimes be repaired by a qualified structural welder with the appropriate filler material and pre/post weld heat treatment. However, cracks in the pivot eye, main beam web, or flange welds should trigger replacement rather than repair — the stress concentrations in these areas mean weld repairs rarely hold under sustained cyclic loading. Always consult a Volvo-trained workshop or structural engineer before attempting cradle repairs."}},{"@type":"Question","name":"What parts do I need when replacing the bogie cradle assembly 22913290?","acceptedAnswer":{"@type":"Answer","text":"Mandatory: (1) Cradle bushings 22717828 — always replace when fitting a new cradle; (2) Pivot bolt 993079 — torque-to-yield, replace each time; (3) Pivot nut 984405 — replace each time. Recommended: Bogie cover 1383063 — inspect seal and replace if damaged. Also inspect axle mounting faces for wear and all associated fasteners."}},{"@type":"Question","name":"Does 22913290 fit both FMX500 and FMX460?","acceptedAnswer":{"@type":"Answer","text":"Part 22913290 is specified for the Volvo FMX500 bogie configuration. Fitment to FMX460 should be verified against your chassis serial number — while the bogie architecture is similar, there may be dimensional differences between the D12 (FMX460) and D13 (FMX500) variants. Always provide your VIN when ordering."}},{"@type":"Question","name":"Is bogie cradle replacement a workshop or roadside job?","acceptedAnswer":{"@type":"Answer","text":"Full bogie cradle assembly replacement is a workshop job requiring: vehicle hoist or pit, hydraulic press for bushings, torque wrench with angle gauge, and access to Volvo workshop manual for the torque procedure. It is not a roadside repair. Estimated workshop time: 6–10 hours depending on access and condition of surrounding components."}},{"@type":"Question","name":"How long does a bogie cradle assembly last on the FMX500?","acceptedAnswer":{"@type":"Answer","text":"Under normal operation within GVW limits, the bogie cradle assembly is designed to be a life-of-vehicle component. Replacement is typically triggered by: overloading damage (construction sites often exceed rated GVW), fatigue from sustained rough terrain operation, or corrosion in high-salt coastal environments. The cradle should be inspected at every major suspension service and whenever bushing replacement is performed."}},{"@type":"Question","name":"Can PTC supply 22913290 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Heavy assemblies can be shipped by sea freight for cost efficiency. Airfreight available for urgent requirements. Full export documentation provided."}},{"@type":"Question","name":"Is 22913290 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket bogie cradle assemblies for 22913290, fabricated to Volvo's original steel specification and dimensional tolerance. Genuine Volvo units are available on request. For a structural component under full GVW cyclic loading, material quality is critical — do not fit sub-specification cradle assemblies."}}]},{"@type":"HowTo","name":"How to Replace Volvo FMX500 Bogie Cradle Assembly 22913290","totalTime":"PT10H","step":[{"@type":"HowToStep","position":1,"name":"Prepare vehicle — support chassis and unload bogie","text":"Park on level, solid ground. Support chassis on heavy-duty stands. Unload the bogie fully. Apply park brake and chock front wheels. Have hydraulic jacks available to support the cradle and axle assemblies during removal."},{"@type":"HowToStep","position":2,"name":"Remove pivot bolt and lower old cradle","text":"Remove pivot bolt 993079 and nut 984405. Lower the old cradle clear of the chassis pivot bracket. Note orientation of spacers and washers. Inspect pivot bracket bore on chassis for wear."},{"@type":"HowToStep","position":3,"name":"Disconnect axle mounts from cradle","text":"The cradle connects to both rear axles at mounting points. Refer to Volvo WTM for the specific procedure — axle mounting arrangement varies by chassis spec. Support each axle on jacks as cradle is removed."},{"@type":"HowToStep","position":4,"name":"Fit new cradle and new bushings 22717828","text":"Press new bushings 22717828 into the new cradle pivot eye using hydraulic press. Fit new cradle to axle mounts per Volvo WTM torque specification. Raise cradle into chassis pivot bracket."},{"@type":"HowToStep","position":5,"name":"Torque pivot bolt and verify geometry","text":"Fit new pivot bolt 993079 and nut 984405. Torque to Volvo WTM specification. Check axle alignment and bogie geometry — measure axle spacing and squareness before releasing vehicle."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX500 Bogie Cradle Assembly 22913290","url":"https://partstrading.com/volvo/suspension-chassis/22913290","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>

  var secWhat=SEC('sec-what','01','Bogie Suspension','What Is the Bogie Cradle Assembly?',
    'The structural spine of the Volvo FMX tandem rear axle system',
    '<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">On a standard single rear axle truck, the chassis rails take all vertical load directly. On the Volvo FMX 6×4 and 8×4, a different approach is used: a <strong style="color:#FFB81C;">bogie tandem rear axle</strong>, where two drive axles are physically connected by a steel cradle beam that pivots on the chassis. Each axle can rise and fall independently, keeping all rear wheels on the ground on rough, uneven terrain.</p>'
    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">Part <strong style="color:#F0ECE6;">22913290</strong> is the <strong style="color:#FFB81C;">bogie cradle assembly</strong> — the fabricated steel beam itself. It is the structural backbone of the bogie system. It connects to both rear axle housings at its ends, and mounts to the chassis via a central pivot point where the cradle bushing (22717828) allows it to rotate. Every tonne of rear axle load passes through this component on every kilometre driven.</p>'

    'Signs that go beyond worn bushings — structural damage indicators',
    '<div class="symptom-item">'
    +'<div class="symptom-icon s-danger">✕</div>'
    +'<div class="symptom-text"><h5>Cracking at Pivot Eye Welds</h5>'
    +'<p>The highest stress point in the cradle is the weld toe at the pivot eye — where the tube or boss that houses the bushing meets the main beam. Fatigue cracks initiate here first. Inspect with dye penetrant after every major suspension event. A crack at this location means the cradle must be replaced; weld repair of pivot eye cracks is unreliable under cyclic loading.</p></div></div>'

    'Field and workshop inspection methods for the FMX bogie cradle assembly',
    '<div class="install-step">'

    'Overview of the replacement procedure — full Volvo WTM required for torque specifications',
    '<div style="padding:12px 18px;background:rgba(255,184,28,.08);border:1px solid rgba(255,184,28,.2);border-radius:6px;font-family:\'Barlow\',sans-serif;font-size:.85rem;color:rgba(240,236,230,.7);line-height:1.7;margin-bottom:20px;">'

  var faqData=[
    ['What is Volvo part 22913290?','Part 22913290 is the bogie cradle assembly for Volvo FMX500 and FMX460 trucks with tandem rear axle. It is the fabricated steel beam that physically connects both rear drive axles at the bogie pivot point, distributing load equally and allowing each axle to articulate independently on rough terrain. It is replaced when cracked, bent, or when the pivot bore is worn beyond bushing specification.'],
    ['What is the difference between 22913290 and 22717828?','Part 22913290 is the structural steel bogie cradle assembly — the beam itself. Part 22717828 is the rubber-bonded steel bushing that fits inside the cradle pivot eye. They are different components. When replacing the cradle (22913290), always fit new bushings (22717828). Bushing replacement (22717828) can be done independently without replacing the cradle, unless the pivot bore is damaged.'],
    ['When do I need to replace the full cradle rather than just the bushings?','Replace the full cradle (22913290) when: visible cracking at pivot eye or main beam welds; visible deformation — one axle higher or lower than the other; pivot bore worn oversized (new bushings will not fit correctly); structural noise persists after bushing replacement; corrosion has compromised beam integrity. Replace bushings only (22717828) when the beam is sound and the bore is within specification.'],
    ['What parts do I need when replacing the bogie cradle assembly?','Mandatory: 22717828 × 2 (new bushings), 993079 (new pivot bolt), 984405 (new pivot nut). All torque-to-yield fasteners must be replaced. Recommended: 1383063 (Bogie Cover) — inspect seal during replacement.'],
    ['How do I inspect the bogie cradle for cracks?','Clean all weld zones thoroughly. Apply dye penetrant to suspected areas — focus on pivot eye weld toes and main beam welds. Allow dwell time, wipe clean, apply developer. Red indications against the white developer confirm cracks. Magnetic particle inspection (MPI) is more sensitive if workshop equipment is available. Also measure pivot bore diameter for ovality.'],
    ['Can the bogie cradle assembly be repaired rather than replaced?','Minor surface cracks in non-structural locations can sometimes be repaired by a qualified structural welder. However, cracks at the pivot eye or main beam welds should trigger replacement rather than repair — stress concentrations in these areas mean weld repairs rarely hold under sustained cyclic loading on a loaded FMX. Consult a Volvo-trained workshop before attempting repairs.'],
    ['Is bogie cradle replacement a roadside job?','No. It requires a workshop with: vehicle hoist or pit, hydraulic press for bushing installation, torque wrench with angle gauge, and Volvo WTM for torque specifications. Estimated 6–10 hours depending on access and component condition. It is not a roadside repair.'],
    ['What causes bogie cradle failure on the FMX500?','Primary causes: (1) Overloading beyond GVW on construction sites — the most common cause; (2) Severe impacts from hidden obstacles on quarry and mine roads; (3) Neglected bushing wear — metal-on-metal pivot contact accelerates bore wear and increases dynamic loads on the beam; (4) Fatigue from sustained off-road operation; (5) Corrosion in coastal or chemical environments.'],
    ['How long does a bogie cradle assembly last?','Under normal operation within GVW limits, the bogie cradle is designed to be a life-of-vehicle component. Replacement is damage-triggered, not mileage-triggered. Construction FMX trucks operating overloaded on quarry roads are the most common replacement case. Inspect at every major suspension service and whenever bushings are replaced.'],

function openLB(i){lbIdx=i;document.getElementById('lb-img').src=IMAGES[i][0];document.getElementById('lightbox').classList.add('open');}
function closeLB(){document.getElementById('lightbox').classList.remove('open');}
function lbNav(d){lbIdx=(lbIdx+d+IMAGES.length)%IMAGES.length;document.getElementById('lb-img').src=IMAGES[lbIdx][0];}
document.getElementById('lightbox').addEventListener('click',function(e){if(e.target===this)closeLB();});
document.addEventListener('keydown',function(e){var lb=document.getElementById('lightbox');if(lb.classList.contains('open')){if(e.key==='Escape')closeLB();if(e.key==='ArrowLeft')lbNav(-1);if(e.key==='ArrowRight')lbNav(1);}});
function buildThumbs(){var c=document.getElementById('gal-thumbs');if(!c)return;IMAGES.forEach(function(im,i){var d=document.createElement('div');d.className='thumb'+(i===0?' active':'');d.innerHTML='<img src="'+im[0]+'" alt="'+im[1]+'">';d.onclick=function(){document.getElementById('gal-img').src=im[0];document.querySelectorAll('.thumb').forEach(function(t){t.classList.remove('active');});d.classList.add('active');lbIdx=i;};c.appendChild(d);});}
buildThumbs();
function toggleFaq(i){var el=document.getElementById('faq-'+i);el.classList.toggle('open');}
</script>
