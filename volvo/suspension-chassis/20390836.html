window.PTC_CUSTOM_SECTIONS=[{type:"specs",title:"Technical Specifications",rows:[{key:"Part Number",val:"20390836"},{key:"Brand",val:"Volvo"},{key:"Component Type",val:"Rubber Spring / Hollow Buffer (Auxiliary Suspension Mount)"},{key:"Material",val:"Natural rubber with steel end plates"},{key:"Shore Hardness",val:"60 Shore A"},{key:"Outer Diameter",val:"120 mm"},{key:"Height (free)",val:"100 mm"},{key:"Height (compressed, max load)",val:"70 mm"},{key:"Static Load Capacity",val:"8 kN (at 25% compression)"},{key:"Mounting",val:"Steel end plates \u2014 top and bottom flange bolt pattern"},{key:"Operating Temperature",val:"-40\u00b0C to +80\u00b0C"},{key:"Application",val:"Auxiliary suspension spring, bump stop, or anti-roll buffer in rear/front suspension assembly"},{key:"Condition",val:"OEM-Specification Aftermarket"},{key:"Dispatch",val:"Same-day from Mumbai (before 3 PM IST)"},{key:"GST Invoice",val:"Available \u2014 all orders"}]},{type:"compat",title:"Compatibility",text:"Volvo FH Series (FH400, FH440, FH460, FH500, FH520, FH540, FH600), FM Series (FM330, FM370, FM410, FM450, FM500), FMX Series (FMX400, FMX420, FMX460, FMX500)."},{type:"procurement",title:"Procurement & Shipping",steps:["WhatsApp +91-98210-37990 or email","Proforma invoice within 60 minutes","Same-day dispatch before 3 PM IST","Worldwide via DHL / FedEx / India Post EMS"],destinations:["India","UAE","Saudi Arabia","Qatar","Nigeria","Kenya","South Africa","Indonesia","Malaysia","Thailand","USA","UK","Australia"]},{type:"faq",title:"Frequently Asked Questions",items:[{q:"What are the specifications of Volvo rubber spring 20390836?",a:"Volvo 20390836 is a natural rubber hollow spring/buffer mount with Shore 60A hardness, 120mm OD, 100mm free height (70mm compressed). Steel end plates top and bottom. Static load capacity 8 kN at 25% compression. Operating range -40\u00b0C to +80\u00b0C. Used as an auxiliary suspension spring, bump stop, or anti-roll buffer on Volvo FH, FM and FMX trucks."},{q:"What is Volvo 20390836 used for?",a:"20390836 is a rubber spring or hollow buffer used in the suspension system. Depending on the chassis position it may function as: an auxiliary spring that supplements the main leaf or air spring under high load; a bump stop that limits suspension travel at maximum compression; or an anti-roll buffer that controls body roll in the bogie suspension. Confirm the exact chassis position from the Volvo Parts Catalogue."},{q:"How do I know if Volvo rubber spring 20390836 needs replacing?",a:"Inspect for: visible cracking or chunking of the rubber (UV and ozone degradation), permanent compression set (rubber does not return to free height when unloaded), delamination of rubber from steel end plates. A rubber spring that has set more than 15% of its free height has lost significant load capacity and should be replaced. Replace as a pair (both sides of an axle) to avoid asymmetric suspension behaviour."},{q:"Is Volvo 20390836 in stock?",a:"Yes \u2014 20390836 is stocked in Mumbai for same-day dispatch before 3 PM IST. WhatsApp +91-98210-37990 for a 60-min proforma invoice."}]},{type:"workshop",title:"Workshop & Sourcing Notes",failure:"Rubber springs and buffers fail gradually through ozone cracking and compression set \u2014 the rubber loses its elastic memory and remains partially compressed. On Volvo FH rear suspension, failed auxiliary springs allow the chassis to 'bottom out' on the bump stops at full load, creating chassis impacts that are misdiagnosed as worn shock absorbers. The rubber-to-steel bond is the secondary failure mode \u2014 delamination is visually obvious and causes progressive looseness in the suspension assembly.",paired:"Replace as an axle pair (both sides). On leaf spring suspensions, commonly ordered with the spring eyes, centre bolt, and U-bolts as a suspension service kit. On bogie suspensions, inspect the anti-roll bar bushes at the same service.",install:"Clean the mounting faces before fitting. Do not lubricate rubber-to-metal contact surfaces with petroleum-based products \u2014 use only silicone grease if lubrication is needed. Torque mounting bolts with the suspension at ride height (load on spring), not at full droop \u2014 rubber springs should be at 20\u201330% compression at static ride height.",sourcing:"PTC stocks 20390836 in Mumbai. MOQ 1 unit. Natural rubber compound \u2014 store away from UV and ozone sources (electric motors, fluorescent lighting) to prevent pre-installation degradation."}];</script>

<script>
// Gallery — runs after product-page.js has injected HTML into #root
function setImg(i) {
  currentImg = i;
  var el = document.getElementById('mainImg');
  if (el) { el.src = IMAGES[i][0]; el.alt = IMAGES[i][1]; }
  document.querySelectorAll('.thumb').forEach(function(t, idx) {
    t.classList.toggle('active', idx === i);
  });
}

function openLightbox(src) {
  var lb = document.getElementById('lightbox');
  var img = document.getElementById('lightboxImg');
  if (!lb || !img) return;
  img.src = src;
  img.alt = IMAGES[currentImg][1];
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  var lb = document.getElementById('lightbox');
  if (lb) lb.classList.remove('open');
  document.body.style.overflow = '';
}

function lbNav(dir) {
  var next = (currentImg + dir + IMAGES.length) % IMAGES.length;
  setImg(next);
  var img = document.getElementById('lightboxImg');
  if (img) { img.src = IMAGES[next][0]; img.alt = IMAGES[next][1]; }
}

// Thumb keyboard access
document.addEventListener('click', function(e) {
  if (e.target.closest && e.target.closest('.gallery-main')) {
    openLightbox(IMAGES[currentImg][0]);
  }
});

// FAQ accordion
document.querySelectorAll('.bfaq-q').forEach(function(q) {
  q.addEventListener('click', function() {
    var item = q.parentElement;
    var wasOpen = item.classList.contains('open');
    document.querySelectorAll('.bfaq-item.open').forEach(function(i) { i.classList.remove('open'); });
    if (!wasOpen) item.classList.add('open');
  });
});

// Thumb keyboard
document.querySelectorAll('.thumb').forEach(function(t) {
  t.addEventListener('keydown', function(e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); t.click(); }
  });
});

// Keyboard: escape closes lightbox, arrows navigate
document.addEventListener('keydown', function(e) {
  var lb = document.getElementById('lightbox');
  if (!lb) return;
  if (e.key === 'Escape') closeLightbox();
  if (lb.classList.contains('open')) {
    if (e.key === 'ArrowRight') lbNav(1);
    if (e.key === 'ArrowLeft')  lbNav(-1);
  }
});
</script>
