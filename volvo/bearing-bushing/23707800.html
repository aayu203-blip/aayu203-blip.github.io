  {"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX / FH / FM Centre Bearing 23707800","alternateName":["Volvo 23707800 Centre Bearing","FMX Propeller Shaft Centre Bearing 23707800","Volvo FH Centre Bearing 23707800","Volvo FM Propshaft Support Bearing 23707800"],"description":"OEM-specification propeller shaft centre bearing for Volvo FMX, FH12, FH13, FH16, FM9, FM12, FM13. Rubber-mounted ball bearing pressed into a bracket that bolts to the chassis cross-member. Supports and centres the propeller shaft mid-span. Replace as a complete unit — do not press just the bearing. Bracket bolts to chassis at 110 Nm. Key failure symptom: vibration between 60 and 120 km/h that increases with road speed. Common to many Volvo truck models.","mpn":"23707800","sku":"23707800","image":["https://partstrading.com/assets/images/parts/suspension.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"23707800"},{"@type":"PropertyValue","name":"Part Type","value":"Propeller Shaft Centre Bearing Assembly"},{"@type":"PropertyValue","name":"Construction","value":"Ball bearing pressed into rubber isolation mount in steel bracket"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX, FH12, FH13, FH16, FM9, FM12, FM13 — most variants"},{"@type":"PropertyValue","name":"Bracket Bolt Torque","value":"110 Nm to chassis cross-member"},{"@type":"PropertyValue","name":"Key Failure Symptom","value":"Vibration between 60 and 120 km/h, increasing with road speed"},{"@type":"PropertyValue","name":"Replacement Rule","value":"Replace as complete unit — do not press bearing only"},{"@type":"PropertyValue","name":"HSN Code","value":"84821000"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.8","reviewCount":"42","bestRating":"5","worstRating":"1"},"offers":{"@type":"Offer","availability":"https://schema.org/InStock","price":"0","priceCurrency":"INR","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Bearing & Bushing","item":"https://partstrading.com/volvo/bearing-bushing/"},{"@type":"ListItem","position":4,"name":"23707800 Centre Bearing","item":"https://partstrading.com/volvo/bearing-bushing/23707800"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 23707800?","acceptedAnswer":{"@type":"Answer","text":"Part 23707800 is the propeller shaft centre bearing assembly for Volvo FMX, FH, and FM trucks. It is a ball bearing pressed into a rubber isolation mount, which in turn sits in a steel bracket that bolts to the chassis cross-member. It supports the propeller shaft mid-span, preventing sag and vibration on the long distance from gearbox to rear axle."}},{"@type":"Question","name":"What is a propeller shaft centre bearing and why does it fail?","acceptedAnswer":{"@type":"Answer","text":"The centre bearing supports the propeller shaft at its mid-point, where it transitions from the front shaft to the rear shaft. Without it, the long shaft would sag and vibrate. The bearing fails due to: water and mud ingress past the rubber seal; fatigue of the rubber mount (the rubber pre-loads the bearing radially); normal ball bearing wear over high mileage; and shock loading from rough terrain."}},{"@type":"Question","name":"What are the symptoms of a failed centre bearing 23707800?","acceptedAnswer":{"@type":"Answer","text":"Primary symptom: vibration felt in the cab between 60 and 120 km/h, increasing with road speed — typically disappears or changes at other speeds. Secondary symptoms: rumbling sound from under the cab, particularly noticeable at 80–100 km/h; vibration that reduces when the truck is unloaded; in advanced failure, audible grinding or knocking from the bearing area under the cab."}},{"@type":"Question","name":"Why must I replace the centre bearing as a complete unit?","acceptedAnswer":{"@type":"Answer","text":"The rubber mount in part 23707800 pre-loads the ball bearing radially — it provides a controlled interference that prevents the bearing inner ring from fretting on the shaft. If you press just the ball bearing into the old rubber mount, the mount's pre-load characteristic is altered (rubber relaxes when the bearing is pressed out and back in), and the bearing will not be correctly supported. Always replace as a complete unit: bracket, rubber, and bearing together."}},{"@type":"Question","name":"What is the bracket bolt torque for centre bearing 23707800?","acceptedAnswer":{"@type":"Answer","text":"The bracket bolts securing the centre bearing to the chassis cross-member torque to approximately 110 Nm. Always verify against the Volvo WTM for your specific chassis. Use new fasteners if the originals show corrosion or thread damage. Under-torqued brackets allow micro-movement of the bearing bracket, which accelerates bearing wear through vibration loading."}},{"@type":"Question","name":"Does 23707800 fit both FMX and FH trucks?","acceptedAnswer":{"@type":"Answer","text":"Yes. Part 23707800 is a common centre bearing fitted across many Volvo truck models: FH12, FH13, FH16, FM9, FM12, FM13, FMX (most variants). This part number's wide fitment is because Volvo standardised this assembly across multiple platforms. Always verify against your chassis serial number — variants exist for different shaft outer diameters and bracket mounting configurations."}},{"@type":"Question","name":"How do I diagnose centre bearing failure vs propeller shaft imbalance?","acceptedAnswer":{"@type":"Answer","text":"Both produce speed-dependent vibration. Centre bearing failure: vibration onset typically at 60–80 km/h, continuous rumbling rather than cyclic buzz, does not change significantly with loaded vs unloaded; rumbling audible from under cab. Shaft imbalance: vibration onset at a specific speed and then reduces at higher speed (classic resonance behaviour); no rumbling. Swap-test by pressing on the bearing bracket while driving slowly to feel if the bearing has play."}},{"@type":"Question","name":"Can I replace the centre bearing with the propeller shaft in place?","acceptedAnswer":{"@type":"Answer","text":"No. The propeller shaft must be disconnected from the centre bearing input and the shaft supported before the bearing bracket is unbolted. The bearing bracket must be removed from the chassis cross-member to be replaced. It is a relatively quick job — typically 1–1.5 hours with the shaft disconnected and supported."}},{"@type":"Question","name":"What other parts should I inspect when replacing centre bearing 23707800?","acceptedAnswer":{"@type":"Answer","text":"Inspect at the same time: 25818663 (front propeller shaft) — check run-out (max 0.3mm) and universal joint play (max 0.1mm); 22728175 (sleeve yoke) — check spline condition; 21081177 (companion flange) — check face runout and spline backlash. If vibration persists after bearing replacement, the shaft requires run-out measurement."}},{"@type":"Question","name":"How long does a Volvo FMX centre bearing last?","acceptedAnswer":{"@type":"Answer","text":"In normal on-highway operation, 200,000–400,000 km is typical. In construction use with regular water-wading, mud ingress, or off-highway shock loading, 100,000–150,000 km is more realistic. The rubber mount tends to fatigue at high mileage even if the bearing is sound — a soft or cracked rubber mount allows bearing movement that accelerates wear."}},{"@type":"Question","name":"Can PTC supply 23707800 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Airfreight for urgent orders. Full export documentation provided."}},{"@type":"Question","name":"Is 23707800 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket centre bearing assemblies for 23707800, manufactured to Volvo's original bearing dimensions, rubber durometer, and bracket specification. Genuine Volvo units available on request."}}]},{"@type":"HowTo","name":"How to Replace Volvo Propeller Shaft Centre Bearing 23707800","totalTime":"PT1H30M","step":[{"@type":"HowToStep","position":1,"name":"Support shaft and disconnect from centre bearing","text":"Raise vehicle on stands. Support the front propeller shaft with a jack or strap. Disconnect the front shaft from the centre bearing input flange — remove the four flange bolts. Slide the sleeve yoke out of the bearing housing."},{"@type":"HowToStep","position":2,"name":"Unbolt centre bearing bracket from chassis","text":"Remove the bracket mounting bolts from the chassis cross-member. Note any shims or spacers used for alignment. Lower the bearing assembly clear of the chassis."},{"@type":"HowToStep","position":3,"name":"Fit new centre bearing assembly","text":"Fit new bearing assembly 23707800 to the chassis cross-member. Refit any shims. Torque bracket bolts to approximately 110 Nm. Verify the bearing is aligned with the shaft centre line — misalignment causes premature bearing failure."},{"@type":"HowToStep","position":4,"name":"Reconnect propeller shaft and torque flange bolts","text":"Grease the sleeve yoke splines. Slide sleeve yoke into centre bearing housing. Connect front propeller shaft to bearing input flange. Torque flange bolts to Volvo WTM specification. Road test — verify no vibration at 60–120 km/h."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX / FH / FM Centre Bearing 23707800","url":"https://partstrading.com/volvo/bearing-bushing/23707800","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}

    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">The rubber mount in the centre bearing assembly performs two functions that are not obvious from visual inspection. First, it <strong style="color:#FFB81C;">isolates vibration</strong> — the rubber compound absorbs the bearing\'s vibration before it reaches the chassis bracket. Second, and more importantly, it <strong style="color:#FFB81C;">pre-loads the ball bearing radially</strong>. The rubber mount is bonded to the bearing outer ring with a controlled interference: the rubber applies a small but precise radial load to the outer ring, which prevents the bearing from fretting on the shaft when the vehicle is stationary and also helps centre the bearing under varying load conditions.</p>'

    ['Can I replace the centre bearing with the propeller shaft in place?','No. The front propeller shaft must be disconnected from the centre bearing and supported before the bracket is removed. The shaft must be free of the bearing before the bracket bolts can be removed from the chassis cross-member.'],

    ['How long does a Volvo centre bearing last?','200,000–400,000 km in normal on-highway use. In construction or off-highway use with regular water and mud exposure, 100,000–150,000 km. Rubber mount fatigue can occur even when the bearing races are still sound — inspect the rubber visually at high mileage services.'],
    ['What torque should I use for the shaft flange bolts?','Shaft flange bolts torque to Volvo WTM specification for your chassis. Typically in the range of 85–120 Nm for FMX propeller shaft flanges — always verify against WTM for your production year and shaft specification.'],
