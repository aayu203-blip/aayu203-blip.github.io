  {"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX Propeller Shaft Sleeve Yoke 22728175","alternateName":["Volvo 22728175 Sliding Sleeve Yoke","FMX Propshaft Slip Yoke 22728175","Volvo FMX Telescoping Shaft Sleeve 22728175","Volvo FMX Drive Shaft Sliding Sleeve 22728175"],"description":"OEM-specification propeller shaft sleeve yoke (sliding sleeve / slip yoke) for the Volvo FMX propeller shaft front assembly. Splined internally — engages with the propeller shaft tube end splines to allow the shaft to change effective length as the chassis geometry changes under suspension travel. Failure: clunking on acceleration/deceleration, vibration. Replace if spline play exceeds 0.5mm. Always regrease splines with CV joint grease on assembly.","mpn":"22728175","sku":"22728175","image":["https://partstrading.com/assets/images/parts/transmission.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"22728175"},{"@type":"PropertyValue","name":"Part Type","value":"Propeller Shaft Sleeve Yoke (Sliding Sleeve / Slip Yoke)"},{"@type":"PropertyValue","name":"Construction","value":"Splined internal bore — slides over propeller shaft tube end"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX propeller shaft front assembly"},{"@type":"PropertyValue","name":"Max Spline Play","value":"0.5 mm — replace if exceeded"},{"@type":"PropertyValue","name":"Grease on Assembly","value":"CV joint grease on all internal splines before sliding onto shaft"},{"@type":"PropertyValue","name":"Failure Signs","value":"Clunking on acceleration/deceleration; vibration; dry splines"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.8","reviewCount":"22","bestRating":"5","worstRating":"1"},"offers":{"@type":"Offer","availability":"https://schema.org/InStock","price":"0","priceCurrency":"INR","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Transmission Parts","item":"https://partstrading.com/volvo/transmission-parts/"},{"@type":"ListItem","position":4,"name":"22728175 Propeller Shaft Sleeve Yoke","item":"https://partstrading.com/volvo/transmission-parts/22728175"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 22728175?","acceptedAnswer":{"@type":"Answer","text":"Part 22728175 is the propeller shaft sleeve yoke (also called slip yoke or sliding sleeve) for the Volvo FMX front propeller shaft assembly. It has a splined internal bore that slides over the splined end of the propeller shaft tube, allowing the effective shaft length to change as suspension travel and chassis geometry alter the distance between the gearbox and centre bearing."}},{"@type":"Question","name":"What does the sleeve yoke 22728175 do?","acceptedAnswer":{"@type":"Answer","text":"The sleeve yoke allows the propeller shaft to change its effective length during operation. As the chassis flexes, as the engine rocks on its mounts, and as manufacturing tolerances are accommodated, the distance between the gearbox output and the centre bearing input changes slightly. The sliding sleeve yoke telescopes to accommodate this variation — without it, the shaft would be over-constrained and would eventually bend or destroy its universal joints."}},{"@type":"Question","name":"What are the symptoms of a worn sleeve yoke 22728175?","acceptedAnswer":{"@type":"Answer","text":"Primary symptom: clunking on acceleration and deceleration — the play in the worn splines is taken up sharply as the torque direction reverses. Secondary: vibration at speed from the imbalance created by the sleeve yoke not running true on the splines. In advanced wear: continuous vibration, particularly under load; visible spline wear when the yoke is removed."}},{"@type":"Question","name":"When should I replace sleeve yoke 22728175?","acceptedAnswer":{"@type":"Answer","text":"Replace when spline play (measured as radial play between the sleeve bore splines and the shaft tube splines) exceeds 0.5mm. Also replace if the splines are visibly worn, if there is axial play (the sleeve can be pulled and pushed on the shaft end), or if the dust seal/boot is torn or missing allowing water and grit to enter the splines."}},{"@type":"Question","name":"What grease should I use on sleeve yoke 22728175?","acceptedAnswer":{"@type":"Answer","text":"Use CV joint grease (constant velocity joint grease) on all internal splines before sliding the sleeve yoke onto the shaft. CV grease has the correct additives to prevent fretting and spline wear under the cyclic sliding motion of the sleeve yoke. Do not use standard chassis grease — it does not have the extreme pressure additives needed for spline contact."}},{"@type":"Question","name":"Does sleeve yoke 22728175 come with the front propeller shaft (25818663)?","acceptedAnswer":{"@type":"Answer","text":"The sleeve yoke may or may not be included with a propeller shaft assembly — confirm when ordering. It is also available as a separate part. When replacing the front propeller shaft, always inspect the sleeve yoke and replace it if spline play exceeds 0.5mm."}},{"@type":"Question","name":"How does the sleeve yoke differ from a universal joint cross?","acceptedAnswer":{"@type":"Answer","text":"The universal joint cross (spider) allows angular misalignment — the angle between two shafts can change. The sleeve yoke (slip yoke) allows length change — the distance between two shafts can change. Both are needed in a propeller shaft because the shaft must accommodate both angle changes and length changes during operation."}},{"@type":"Question","name":"Can I run without greasing the sleeve yoke splines?","acceptedAnswer":{"@type":"Answer","text":"No. Dry splines on a sleeve yoke cause fretting wear — a particularly destructive form of wear where the sliding contact under load removes metal at an accelerated rate. A dry sleeve yoke will wear beyond 0.5mm play within 50,000–100,000 km in heavy service. Always regrease with CV joint grease every time the shaft is removed and at each major drivetrain service."}},{"@type":"Question","name":"What other parts should I inspect with 22728175?","acceptedAnswer":{"@type":"Answer","text":"Inspect at the same time: 25818663 (front propeller shaft) — run-out and UJ play; 23707800 (centre bearing) — vibration at 60–120 km/h indicates bearing failure; 21081177 (companion flange) — spline backlash max 0.15mm and face runout max 0.08mm."}},{"@type":"Question","name":"What causes sleeve yoke splines to wear on the Volvo FMX?","acceptedAnswer":{"@type":"Answer","text":"Main causes: (1) Dry operation — no grease on splines, leading to metal-to-metal fretting; (2) Grit contamination through a torn dust boot — abrasive spline wear; (3) Operation with incorrect shaft angle — excessive angular movement amplifies the telescoping stroke; (4) Overloading — higher torque increases the contact pressure on spline flanks."}},{"@type":"Question","name":"Can PTC supply 22728175 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Airfreight for urgent orders. Full export documentation provided."}},{"@type":"Question","name":"Is 22728175 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket sleeve yokes for 22728175 manufactured to Volvo's original spline profile, bore diameter, and surface finish specification. Genuine Volvo units available on request."}}]},{"@type":"HowTo","name":"How to Replace and Regrease Volvo FMX Sleeve Yoke 22728175","totalTime":"PT1H","step":[{"@type":"HowToStep","position":1,"name":"Disconnect propeller shaft and slide sleeve yoke off","text":"Raise vehicle on stands. Disconnect the front propeller shaft (25818663) from the centre bearing (23707800) input flange. Slide the sleeve yoke (22728175) out of the centre bearing housing."},{"@type":"HowToStep","position":2,"name":"Inspect spline play and dust seal condition","text":"Measure radial play between sleeve yoke bore splines and shaft tube splines. Replace if play exceeds 0.5mm. Inspect dust seal/boot — replace if torn. A torn boot allows grit ingress that causes abrasive spline wear."},{"@type":"HowToStep","position":3,"name":"Apply CV joint grease to splines","text":"Clean all splines thoroughly. Apply a generous film of CV joint grease to the internal splines of the sleeve yoke. Also apply to the external splines of the shaft tube end. CV grease must cover all tooth flanks."},{"@type":"HowToStep","position":4,"name":"Slide sleeve yoke onto shaft and reconnect","text":"Slide the greased sleeve yoke onto the shaft tube end splines until fully seated. Connect to the centre bearing input flange. Torque flange bolts to Volvo WTM specification. Road test — verify no clunking or vibration."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX Propeller Shaft Sleeve Yoke 22728175","url":"https://partstrading.com/volvo/transmission-parts/22728175","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}
