  {"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Volvo FMX500 / FMX460 Companion Flange 21081177","alternateName":["Volvo 21081177 Companion Flange","FMX500 Rear Axle Yoke 21081177","Volvo FMX Pinion Flange 21081177","Volvo FMX460 Propshaft Flange 21081177"],"description":"OEM-specification companion flange (splined yoke) at the differential/rear axle pinion input for Volvo FMX460, FMX500, FMX540. 4-bolt flange face. Connects rear propeller shaft to rear axle pinion. Wear check: spline backlash max 0.15mm; face flatness max 0.08mm runout. Always renew the pinion seal (separate part) when replacing the flange. Fit a new self-locking pinion nut — never reuse. Pinion nut torque approximately 450 Nm.","mpn":"21081177","sku":"21081177","image":["https://partstrading.com/assets/images/parts/transmission.jpg"],"brand":{"@type":"Brand","name":"Volvo"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"21081177"},{"@type":"PropertyValue","name":"Part Type","value":"Companion Flange (Splined Pinion Yoke)"},{"@type":"PropertyValue","name":"Flange Configuration","value":"4-bolt flange face"},{"@type":"PropertyValue","name":"Application","value":"Volvo FMX460, FMX500, FMX540 rear axle pinion input"},{"@type":"PropertyValue","name":"Max Spline Backlash","value":"0.15 mm"},{"@type":"PropertyValue","name":"Max Face Runout","value":"0.08 mm"},{"@type":"PropertyValue","name":"Pinion Nut Torque","value":"Approximately 450 Nm — new self-locking nut, never reuse"},{"@type":"PropertyValue","name":"Pinion Seal","value":"Always replace pinion seal when replacing companion flange"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}],"aggregateRating":{"@type":"AggregateRating","ratingValue":"4.8","reviewCount":"14","bestRating":"5","worstRating":"1"},"offers":{"@type":"Offer","availability":"https://schema.org/InStock","price":"0","priceCurrency":"INR","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Volvo Parts","item":"https://partstrading.com/volvo/"},{"@type":"ListItem","position":3,"name":"Transmission Parts","item":"https://partstrading.com/volvo/transmission-parts/"},{"@type":"ListItem","position":4,"name":"21081177 Companion Flange","item":"https://partstrading.com/volvo/transmission-parts/21081177"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Volvo part 21081177?","acceptedAnswer":{"@type":"Answer","text":"Part 21081177 is the companion flange (splined pinion yoke) at the rear axle differential input on the Volvo FMX460, FMX500, and FMX540. It connects the rear propeller shaft to the rear axle pinion via a 4-bolt flange face. It splines onto the pinion shaft and is secured with a self-locking pinion nut."}},{"@type":"Question","name":"What is the maximum spline backlash for companion flange 21081177?","acceptedAnswer":{"@type":"Answer","text":"Maximum permissible spline backlash for companion flange 21081177 is 0.15mm. This is measured as the rotational play between the flange splines and the pinion shaft splines when the flange is held stationary and the pinion is moved. Beyond 0.15mm, the splines are worn and the flange must be replaced."}},{"@type":"Question","name":"What is the maximum face runout for companion flange 21081177?","acceptedAnswer":{"@type":"Answer","text":"Maximum permissible face flatness runout for companion flange 21081177 is 0.08mm. This is measured with a dial gauge on the propeller shaft bolt face of the flange while rotating it on the pinion. Runout above 0.08mm means the flange face is not perpendicular to the shaft axis — it will cause the rear propeller shaft to run eccentrically, producing vibration."}},{"@type":"Question","name":"What is the pinion nut torque for 21081177?","acceptedAnswer":{"@type":"Answer","text":"The pinion nut torque for companion flange 21081177 is approximately 450 Nm. Always fit a new self-locking nut — never reuse the old nut. A reused self-locking nut does not provide the correct pre-load and will loosen under the cyclic loading of the drivetrain. Verify torque against the Volvo WTM for your specific chassis and axle specification."}},{"@type":"Question","name":"Why must I replace the pinion seal when replacing the companion flange?","acceptedAnswer":{"@type":"Answer","text":"The pinion seal lives on the pinion shaft immediately behind the companion flange. When the flange is removed, the seal lip is exposed to damage from tools and handling. More importantly, the seal lip has a running track on the companion flange — when a worn flange is replaced, a new seal must be fitted to run on the unworn track of the new flange. Fitting a new flange with an old seal (with its lip shaped to the worn track) will produce an immediate leak."}},{"@type":"Question","name":"What models does 21081177 fit?","acceptedAnswer":{"@type":"Answer","text":"Part 21081177 fits Volvo FMX460, FMX500, and FMX540 at the rear axle pinion input. Always verify against your chassis VIN and rear axle specification — different rear axle ratio and load rating combinations may use different flange specifications."}},{"@type":"Question","name":"What are the symptoms of a worn companion flange?","acceptedAnswer":{"@type":"Answer","text":"Worn splines: clunking on acceleration/deceleration (the backlash being taken up as torque direction reverses); vibration under load. Worn face runout: speed-dependent vibration from the rear of the vehicle, similar to propeller shaft imbalance. Oil leak at pinion: worn or damaged seal — often caused by a worn flange with a grooved seal track. Always check spline backlash and face runout together."}},{"@type":"Question","name":"Can I reuse the pinion nut when replacing 21081177?","acceptedAnswer":{"@type":"Answer","text":"No. The pinion nut on the FMX rear axle is a self-locking nut — its locking element deforms plastically on first installation to provide the required clamp load. Reusing a self-locking nut that has already been torqued does not restore the original pre-load and the nut will loosen under drivetrain cyclic loading, leading to pinion shaft play and rapid differential damage. Always fit a new self-locking pinion nut."}},{"@type":"Question","name":"What tools are needed to replace companion flange 21081177?","acceptedAnswer":{"@type":"Answer","text":"Required: pinion flange holding tool (to prevent rotation while torquing pinion nut); torque wrench calibrated to 450+ Nm; socket for pinion nut; seal driver for new pinion seal; dial gauge with magnetic stand for spline backlash and face runout measurement before and after fitting."}},{"@type":"Question","name":"What other parts should I inspect when replacing 21081177?","acceptedAnswer":{"@type":"Answer","text":"Always replace pinion seal (separate part). Also inspect: rear propeller shaft for run-out and universal joint play; 23707800 (centre bearing) if vibration is present; 25818663 (front propeller shaft). Check for differential oil level and condition — a failed pinion seal may have allowed gear oil to run out."}},{"@type":"Question","name":"Can PTC supply 21081177 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Airfreight for urgent orders. Full export documentation provided."}},{"@type":"Question","name":"Is 21081177 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket companion flanges for 21081177 manufactured to Volvo's original spline profile, flange face flatness tolerance, and material specification. Genuine Volvo units available on request."}}]},{"@type":"HowTo","name":"How to Replace Volvo FMX Companion Flange 21081177","totalTime":"PT2H","step":[{"@type":"HowToStep","position":1,"name":"Mark phase and disconnect rear propeller shaft","text":"Mark the angular phase between the companion flange and the rear propeller shaft before disconnecting. Remove the 4 flange bolts connecting the shaft to the flange. Support and tie back the shaft."},{"@type":"HowToStep","position":2,"name":"Measure and record existing backlash and runout","text":"Before removing the flange, measure spline backlash (max 0.15mm) and face runout (max 0.08mm) to confirm replacement is required and establish baseline for new flange verification."},{"@type":"HowToStep","position":3,"name":"Remove pinion nut and pull companion flange","text":"Use a flange holding tool to prevent rotation. Remove the pinion nut — discard immediately, never reuse. Use a suitable puller to remove the companion flange from the pinion shaft splines."},{"@type":"HowToStep","position":4,"name":"Replace pinion seal","text":"Remove the old pinion seal with a seal puller. Clean the seal housing. Fit new pinion seal with a seal driver — drive squarely, do not cock. Lightly oil the seal lip."},{"@type":"HowToStep","position":5,"name":"Fit new flange and torque new self-locking pinion nut","text":"Push new companion flange 21081177 onto pinion splines. Fit a NEW self-locking pinion nut — never reuse. Torque to approximately 450 Nm using a flange holding tool. Verify against Volvo WTM for your axle specification. Measure face runout of new flange (must be under 0.08mm). Reconnect rear shaft in original phase. Road test."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Volvo FMX500 / FMX460 Companion Flange 21081177","url":"https://partstrading.com/volvo/transmission-parts/21081177","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}

  var secWhat=SEC('sec-what','01','Rear Axle Drivetrain','What Is the Companion Flange 21081177?',
    'The connection point between rear propeller shaft and differential pinion on the FMX',
    '<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">The <strong style="color:#FFB81C;">companion flange</strong> (also called a splined pinion yoke or flange yoke) is the interface between the rotating propeller shaft and the rear axle differential pinion. On the Volvo FMX 6×4, the rear propeller shaft terminates at the companion flange, which is splined onto the pinion shaft and locked in place with a self-locking nut. The propeller shaft bolts to the flange face via four bolts.</p>'
    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">Part <strong style="color:#F0ECE6;">21081177</strong> is the companion flange at the rear axle pinion input. Every newton-metre of torque from the drivetrain passes through this component into the differential. It operates under high cyclic loading — full engine torque under acceleration, compression braking torque under deceleration, and dynamic shock loads on rough terrain. The splines and flange face are precision-machined to close tolerances.</p>'

    '<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">Spline backlash is the rotational play between the companion flange internal splines and the pinion shaft external splines. As the drivetrain transmits torque in both directions over high mileage, the spline flanks wear — the clearance between flange and shaft spline tooth profiles increases. This shows as a clunk when the torque direction reverses (acceleration to overrun or vice versa).</p>'

  var secRunout=SEC('sec-runout','06','Wear Check','Face Runout Inspection — Max 0.08mm',
    'How to measure companion flange face runout and why it matters',
    '<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">Face runout is a measure of how perpendicular the propeller shaft bolt face of the flange is to the pinion shaft axis. If the face is not perfectly perpendicular, the propeller shaft that bolts to it will run at a slight angle — it will be eccentrically loaded once per revolution, causing vibration and accelerating universal joint wear.</p>'

  var secSeal=SEC('sec-seal','07','Critical Rule','Pinion Seal — Always Replace When Changing the Flange',
    'Why fitting a new flange with an old seal causes immediate leaks',
    '<div style="background:rgba(220,53,69,.06);border:1px solid rgba(220,53,69,.15);border-radius:8px;padding:20px 24px;margin-bottom:20px;">'

    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">The pinion seal lip runs directly on the sealing surface of the companion flange. Over time, the seal lip polishes a running track in the flange surface. When the flange is replaced, the new flange has an unworn, full-diameter sealing surface. An old seal with its lip already shaped to the worn track of the old flange will not seal correctly on the new flange — the lip does not contact the new, unworn surface evenly. Result: immediate gear oil leak past the pinion seal.</p>'
    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;">The reverse is equally true: when a new pinion seal is fitted, it should have a new companion flange to seal against — an old flange with a worn track will cause the new seal to leak quickly because the lip collapses into the worn groove. The correct procedure is always: new flange + new pinion seal together.</p>'

    +'<p style="font-family:\'Barlow\',sans-serif;font-size:.95rem;color:rgba(240,236,230,.75);line-height:1.8;margin-bottom:18px;">The pinion nut is a <strong style="color:#FFB81C;">self-locking nut</strong> — it has an integral locking element (typically a nylon insert, a distorted thread, or a staked collar) that deforms plastically during the first installation to grip the thread and prevent loosening under vibration. When a self-locking nut is removed and re-torqued, the locking element has already been deformed and does not provide the same resistance to loosening. The nut can back off under the cyclic loading of the drivetrain.</p>'

  var faqData=[
    ['What is Volvo part 21081177?','Part 21081177 is the companion flange (splined pinion yoke) at the rear axle differential input on the Volvo FMX460, FMX500, and FMX540. It connects the rear propeller shaft to the rear axle differential pinion via a 4-bolt flange face. It is splined onto the pinion shaft and secured with a self-locking pinion nut.'],
