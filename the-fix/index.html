<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>THE FIX</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
</head>

<body>
    <div class="crt-overlay"></div>
    <div class="scanline"></div>

    <div class="terminal">
        <header>
            <div class="row">
                <span class="label">SYSTEM:</span> <span class="val">ONLINE</span>
                <span class="spacer"></span>
                <span class="label">TIME:</span> <span class="val" id="playtime">00:00:00</span>
            </div>
            <div class="row">
                <span class="label">ERA:</span> <span class="val" id="era-name">Thinking...</span>
            </div>
        </header>

        <hr class="dashed">

        <div class="dashboard">
            <div class="col left">
                <div class="readout-box">
                    <div class="label">LIQUID ASSETS</div>
                    <div class="val large" id="cash">$0.00</div>
                    <div class="subval" id="revenue">+$0.00/sec</div>
                </div>

                <div class="readout-box">
                    <div class="label">HEAT LEVEL</div>
                    <div class="val warning" id="heat">0%</div>
                </div>

                <div class="cmd-area">
                    <div class="label">COMMAND INPUT:</div>
                    <div class="action-link" id="btn-cut">[ EXECUTE: CUT ]</div>
                </div>
            </div>

            <div class="col right">
                <div class="label">ASSET ALLOCATION</div>
                <div id="asset-list" class="list-container">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>

        <div class="footer">
            <span class="cursor">_</span>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="game.js"></script>
    <script src="data/eras.js"></script>
    <script src="data/upgrades.js"></script>
    <script src="data/buildings.js"></script>
    <script src="systems/humanity.js"></script>
    <script src="systems/prestige.js"></script>
    <script src="systems/heat.js"></script>
    <script src="ui.js"></script>

    <script>
        // Boot
        window.onload = () => {
            Engine.init();
            UI.init();
        };
    </script>
</body>

</html>
