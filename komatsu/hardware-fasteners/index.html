function useInView(opts={}){
  const ref=useRef(); const [v,setV]=useState(false);
  useEffect(()=>{
    const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){setV(true);o.disconnect();}},{threshold:0.07,...opts});
    if(ref.current) o.observe(ref.current); return()=>o.disconnect();
  },[]);
  return [ref,v];
}

function useCountdown(){
  const [s,setS]=useState({h:0,m:0,sec:0,urgent:false,closed:false});
  useEffect(()=>{
    const tick=()=>{
      const ist=new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
      const day=ist.getDay(); const nowM=ist.getHours()*60+ist.getMinutes();
      if(day===0||nowM>=900){setS({h:0,m:0,sec:0,urgent:false,closed:true});return;}
      const rem=900-nowM;
      setS({h:Math.floor(rem/60),m:rem%60,sec:59-ist.getSeconds(),urgent:rem<=60,closed:false});
    };
    tick(); const t=setInterval(tick,1000); return()=>clearInterval(t);
  },[]);
  return s;
}

function ReadingProgress(){
  const [pct,setPct]=useState(0);
  useEffect(()=>{
    const fn=()=>{
      const doc=document.documentElement;
      const scrolled=doc.scrollTop||document.body.scrollTop;
      const total=doc.scrollHeight-doc.clientHeight;
      setPct(total>0?Math.min(100,(scrolled/total)*100):0);
    };
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:10000,height:3,background:'rgba(255,255,255,0.04)',pointerEvents:'none'}}>
      <div style={{height:'100%',background:AMBER,width:`${pct}%`,transition:'width 0.1s linear',boxShadow:`0 0 10px ${AMBER}66`}}/>

  );
}

// ── REVEAL HOOK ───────────────────────────────────────────────────────────────
function useReveal(){
  const ref=useRef();
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('in');obs.disconnect();}},{threshold:0.08});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return ref;
}

// ── SCROLL SPY ────────────────────────────────────────────────────────────────
function useScrollSpy(ids){
  const [active,setActive]=useState(ids[0]);
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting) setActive(e.target.id);});
    },{rootMargin:'-20% 0px -70% 0px'});
    ids.forEach(id=>{const el=document.getElementById(id);if(el) obs.observe(el);});
    return()=>obs.disconnect();
  },[ids.join(',')]);
  return active;
}

// ── SEARCH MODAL ──────────────────────────────────────────────────────────────
function SearchModal({open,onClose,defaultBrand='All'}){
  const [q,setQ]=useState('');
  const [brand,setBrand]=useState(defaultBrand);
  const inputRef=useRef();
  const brands=['All','Volvo','Scania','Komatsu','CAT','Hitachi'];

  useEffect(()=>{if(open){setTimeout(()=>inputRef.current?.focus(),80);}else{setQ('');}},[open]);
  useEffect(()=>{
    const fn=e=>{if(e.key==='Escape') onClose();};
    window.addEventListener('keydown',fn); return()=>window.removeEventListener('keydown',fn);
  },[onClose]);

  const results=useMemo(()=>{
    if(q.length<2) return [];
    const lq=q.toLowerCase();
    return SEARCH_PARTS.filter(p=>(
      (p.partNo.toLowerCase().includes(lq)||p.name.toLowerCase().includes(lq)||p.brand.toLowerCase().includes(lq))
      &&(brand==='All'||p.brand===brand)
    )).slice(0,8);
  },[q,brand]);

  if(!open) return null;
  return(
    <div onClick={onClose} style={{position:'fixed',inset:0,zIndex:9999,background:'rgba(0,0,0,0.88)',backdropFilter:'blur(8px)',display:'flex',alignItems:'flex-start',justifyContent:'center',paddingTop:80}}>
      <div style={{animation:'modalIn 0.2s ease both',width:'100%',maxWidth:720,margin:'0 16px',background:T.bgCard,border:`1px solid ${T.border}`,borderRadius:16,overflow:'hidden',boxShadow:'0 40px 120px rgba(0,0,0,0.8)'}}
        onClick={e=>e.stopPropagation()}>
        {/* Brand chips */}
        <div style={{display:'flex',gap:8,padding:'16px 20px 0',flexWrap:'wrap'}}>
          {brands.map(b=>(
            <button key={b} onClick={()=>setBrand(b)} style={{fontFamily:B,fontSize:12,fontWeight:700,padding:'5px 14px',borderRadius:20,border:`1px solid ${brand===b?AMBER:'rgba(255,255,255,0.1)'}`,cursor:'pointer',background:brand===b?AMBER:'transparent',color:brand===b?'#050505':'rgba(255,255,255,0.5)',transition:'all 0.15s'}}>{b}</button>
          ))}
          <button onClick={onClose} style={{marginLeft:'auto',background:'transparent',border:'none',cursor:'pointer',color:T.muted,padding:'4px 8px',display:'flex',alignItems:'center'}}>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        {/* Input */}
        <div style={{display:'flex',alignItems:'center',borderBottom:`1px solid ${T.border}`,margin:'12px 0 0'}}>
          <div style={{padding:'0 20px',flexShrink:0}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={T.muted} strokeWidth="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </div>
          <input ref={inputRef} type="search" value={q} onChange={e=>setQ(e.target.value)}
            placeholder="Part number or description — e.g. VOE20450734 or hydraulic pump"
            style={{flex:1,padding:'18px 16px 18px 0',fontSize:16,fontFamily:B,fontWeight:500,background:'transparent',border:'none',color:T.text,outline:'none'}}/>
        </div>
        {/* Results */}
        {q.length>=2&&(results.length===0?(
          <div style={{padding:'24px 20px',display:'flex',justifyContent:'space-between',alignItems:'center',gap:12}}>
            <div>
              <div style={{fontFamily:D,fontWeight:700,fontSize:16,color:T.text,marginBottom:4}}>No match in demo index</div>
              <div style={{fontFamily:B,fontSize:13,color:T.muted}}>Full database has 51,000+ parts — WhatsApp us directly.</div>
            </div>
            <a href={WA(`Hi, I'm searching for: ${q}. Please check availability and pricing.`)} target="_blank"
              style={{display:'flex',alignItems:'center',gap:8,background:WG,color:'#fff',textDecoration:'none',padding:'11px 18px',borderRadius:9,fontFamily:D,fontWeight:700,fontSize:14,whiteSpace:'nowrap',flexShrink:0}}>
              <WASvg/> Ask on WhatsApp
            </a>
          </div>
        ):(
          <div>
            {results.map(r=>(
              <a key={r.partNo} href={WA(`Hi, I need part ${r.partNo} — ${r.name} (${r.brand}). Please confirm availability and pricing.`)} target="_blank"
                style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'13px 20px',borderBottom:`1px solid ${T.border}`,textDecoration:'none',transition:'background 0.15s',gap:12}}
                onMouseEnter={e=>e.currentTarget.style.background='rgba(255,184,28,0.04)'}
                onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                <div>
                  <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:3,flexWrap:'wrap'}}>
                    <span style={{fontFamily:'monospace',fontWeight:700,fontSize:14,color:AMBER}}>{r.partNo}</span>
                    <span style={{fontFamily:B,fontSize:11,color:T.muted,background:'rgba(255,255,255,0.04)',padding:'2px 8px',borderRadius:4,border:`1px solid ${T.border}`}}>{r.brand}</span>
                    <span style={{fontFamily:B,fontSize:11,color:T.muted,background:'rgba(255,255,255,0.04)',padding:'2px 8px',borderRadius:4,border:`1px solid ${T.border}`}}>{r.cat}</span>
                  </div>
                  <div style={{fontFamily:B,fontSize:13,color:T.muted}}>{r.name}</div>
                </div>
                <span style={{fontFamily:B,fontSize:12,color:WG,fontWeight:700,flexShrink:0,display:'flex',alignItems:'center',gap:4}}><WASvg color={WG}/>WhatsApp</span>
              </a>
            ))}
            <div style={{padding:'10px 20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontFamily:B,fontSize:12,color:T.muted}}>{results.length} results · full 51K+ database on WhatsApp</span>
              <a href={WA(`Hi, I'm searching for: ${q}. Can you help?`)} target="_blank" style={{fontFamily:B,fontSize:12,color:AMBER,textDecoration:'none',fontWeight:700}}>Search all 51K+ →</a>
            </div>
          </div>
        ))}
        {q.length<2&&(
          <div style={{padding:'20px',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontFamily:B,fontSize:12,color:T.muted}}>51,000+ parts indexed · type 2+ characters to search</span>
            <span style={{fontFamily:B,fontSize:12,color:T.muted}}>Esc to close</span>
          </div>
        )}
      </div>
    </div>
  );
}

function AnnouncementBar(){
  const geo=useGeo();
  const ship=geoShip(geo);
  const shippingItem=ship&&geo
    ?(geo.country==='IN'?`India domestic: ${ship.est} · same-day dispatch available`:`Ships to ${geo.countryName} in ${ship.est} via ${ship.via}`)
    :'Shipping to 50+ countries worldwide';
  const items=[
    'Order before 3 PM IST — ships same day',
    shippingItem,
    '51,000+ parts ready to dispatch, Mumbai',
    'WhatsApp · Email · SWIFT & UPI accepted',
    'Est. 1956 — 70 years of trusted supply',
  ];
  const all=[...items,...items];
  return(
    <div style={{background:AMBER,overflow:'hidden',padding:'9px 0'}}>
      <div className="act-inner" style={{display:'flex',gap:64,width:'max-content',alignItems:'center'}}>

}

// Map filter chip labels to part name keywords for demo filtering
const FILTER_KEYWORDS = {
  'All':null,'Pumps':['pump'],'Motors':['motor'],'Cylinders':['cylinder'],
  'Hoses & Fittings':['hose','fitting'],'Valves':['valve'],'Accumulators':['accumulator'],
  'EC Series':['EC'],'FH Series':['FH'],'FM Series':['FM'],
};

function PartsGrid({activeFilter}){
  const p=CATEGORY_TPL;
  const [visible,setVisible]=useState(12);
  const kw=FILTER_KEYWORDS[activeFilter];
  const parts=kw
    ? p.parts.filter(pt=>kw.some(k=>pt.name.toLowerCase().includes(k.toLowerCase())||pt.models.some(m=>m.includes(k))))
    : p.parts;
  return(
    <Section id="sec-parts-list" num="01" style={{padding:'40px 0 64px',borderBottom:`1px solid ${T.border}`}}>
      <div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:24,flexWrap:'wrap',gap:8}}>
          <span style={{fontFamily:B,fontSize:13,color:T.muted}}>
            Showing <strong style={{color:T.text}}>{Math.min(visible,parts.length)}</strong> of <strong style={{color:T.text}}>{activeFilter==='All'?p.partCount:parts.length}</strong> parts
            {activeFilter!=='All'&&<span style={{color:AMBER,marginLeft:8}}>· filtered by {activeFilter}</span>}
          </span>
          <span style={{fontFamily:B,fontSize:12,color:T.green,display:'flex',alignItems:'center',gap:5}}>
            <span style={{width:6,height:6,borderRadius:'50%',background:T.green,display:'inline-block'}}/>
            All in stock · same-day dispatch
          </span>
        </div>
        {parts.length===0&&(
          <div style={{textAlign:'center',padding:'48px 0'}}>
            <div style={{fontFamily:D,fontSize:18,fontWeight:700,color:T.muted,marginBottom:12}}>No demo parts match this filter</div>
            <a href={WA(`Hi, I need ${p.brand} ${activeFilter} — do you have them in stock?`)} target="_blank"
              style={{display:'inline-flex',alignItems:'center',gap:8,background:WG,color:'#fff',textDecoration:'none',padding:'11px 24px',borderRadius:9,fontFamily:D,fontWeight:700,fontSize:14,letterSpacing:'0.04em'}}>
              <WASvg/> Ask for {activeFilter} on WhatsApp
            </a>
          </div>
        )}
        <div className="grid-4" style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:12}}>
          {parts.slice(0,visible).map((part,i)=>{
            const [hov,setHov]=useState(false);
            const isMostOrdered=i<3;
            return(
              <div key={part.partNo} className="card-shine"
                style={{background:T.bgCard,border:`1px solid ${hov?AMBER:T.border}`,borderRadius:12,padding:'18px 20px 16px',transition:'all 0.2s',transform:hov?'translateY(-2px)':'none',position:'relative'}}
                onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}>
                {isMostOrdered&&<div style={{position:'absolute',top:12,right:12,fontFamily:D,fontSize:9,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',background:'rgba(255,184,28,0.12)',color:AMBER,border:'1px solid rgba(255,184,28,0.25)',padding:'2px 8px',borderRadius:3}}>Popular</div>}
                <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:8}}>
                  <span style={{width:6,height:6,borderRadius:'50%',background:T.green,display:'inline-block',flexShrink:0}}/>
                  <span style={{fontFamily:B,fontSize:10,fontWeight:700,color:T.green}}>In Stock</span>
                </div>
                <code style={{fontFamily:'monospace',fontSize:12,color:AMBER,fontWeight:700,letterSpacing:'0.04em',display:'block',marginBottom:8,overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis'}}>{part.partNo}</code>
                <div style={{fontFamily:B,fontSize:13,color:T.text,fontWeight:600,lineHeight:1.35,marginBottom:10,minHeight:38}}>{part.name}</div>
                <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:14}}>
                  {part.models.slice(0,3).map(m=>(
                    <span key={m} style={{fontFamily:D,fontSize:9,fontWeight:700,color:T.muted,background:'rgba(255,255,255,0.03)',border:`1px solid ${T.border}`,padding:'2px 6px',borderRadius:3,letterSpacing:'0.04em',whiteSpace:'nowrap'}}>{m}</span>
                  ))}
                  {part.models.length>3&&<span style={{fontFamily:D,fontSize:9,color:T.muted,padding:'2px 6px'}}>+{part.models.length-3}</span>}
                </div>
                <div style={{display:'flex',gap:6}}>
                  <a href={partLink(part.partNo)}
                    style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:hov?AMBER:'transparent',border:`1px solid ${hov?AMBER:T.border}`,color:hov?'#050505':T.muted,textDecoration:'none',padding:'7px 0',borderRadius:7,fontFamily:D,fontWeight:700,fontSize:11,letterSpacing:'0.05em',textTransform:'uppercase',transition:'all 0.2s'}}>
                    View Details
                  </a>
                  <a href={WA(`Hi, I need part ${part.partNo} — ${part.name} (${p.brand} ${p.category}). Please confirm stock and price.`)} target="_blank"
                    style={{width:34,display:'flex',alignItems:'center',justifyContent:'center',background:WG,borderRadius:7,flexShrink:0,transition:'opacity 0.2s'}}
                    onMouseEnter={e=>e.currentTarget.style.opacity='0.8'} onMouseLeave={e=>e.currentTarget.style.opacity='1'}
                    title="WhatsApp for quote">
                    <WASvg/>
                  </a>
                </div>
              </div>
            );
          })}
        </div>
        {visible<parts.length&&(
          <div style={{textAlign:'center',marginTop:36}}>
            <button onClick={()=>setVisible(v=>v+12)}
              style={{background:T.bgCard,border:`1px solid ${T.border}`,color:T.text,padding:'14px 40px',borderRadius:10,fontFamily:D,fontWeight:700,fontSize:16,letterSpacing:'0.06em',textTransform:'uppercase',cursor:'pointer',transition:'all 0.2s'}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=AMBER;e.currentTarget.style.color=AMBER;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=T.border;e.currentTarget.style.color=T.text;}}>
              Load More — {parts.length-visible} remaining
            </button>
          </div>
        )}
        {visible>=parts.length&&parts.length>0&&(
          <div style={{textAlign:'center',marginTop:32}}>
            <p style={{fontFamily:B,fontSize:13,color:T.muted,marginBottom:16}}>All {parts.length} parts shown. Need more options?</p>
            <a href={WA(`Hi, I need more ${p.brand} ${p.category}. Can you send additional options?`)} target="_blank"
              style={{display:'inline-flex',alignItems:'center',gap:8,background:WG,color:'#fff',textDecoration:'none',padding:'12px 28px',borderRadius:10,fontFamily:D,fontWeight:800,fontSize:15,letterSpacing:'0.06em',textTransform:'uppercase'}}>
              <WASvg/> Ask about more parts
            </a>
          </div>
        )}
      </div>
    </Section>
  );
}
