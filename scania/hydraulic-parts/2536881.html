  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Scania GRS905R Gearbox Oil Pump with Cover 2536881","alternateName":["Scania 2536881 Oil Pump","GRS905R Gearbox Pump 2536881","Scania 2409146 Oil Pump","Scania 2360885 Oil Pump"],"description":"Gear-type oil pump with cover for the Scania GRS905R 12-speed range-split automated gearbox. Circulates gear oil under pressure to lubricate and cool all internal bearings, gear teeth, synchronizer rings, and shift forks. Fits Scania G, P, R, T, L, S Series trucks equipped with GRS905R or GRS895R gearbox (2016 onwards). Cross-references: 2409146, 2360885.","mpn":"2536881","sku":"2536881","image":["https://partstrading.com/assets/images/parts/hydraulics.jpg"],"brand":{"@type":"Brand","name":"Scania"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"2536881"},{"@type":"PropertyValue","name":"Cross Reference","value":"2409146, 2360885"},{"@type":"PropertyValue","name":"Part Type","value":"Gearbox Oil Pump with Cover"},{"@type":"PropertyValue","name":"Application Gearbox","value":"Scania GRS905R (12-speed range-split)"},{"@type":"PropertyValue","name":"Pump Type","value":"Gear-type positive displacement pump"},{"@type":"PropertyValue","name":"Drive","value":"Input shaft driven (crankshaft speed referenced)"},{"@type":"PropertyValue","name":"Vehicle Fitment","value":"Scania G, P, R, T, L, S Series — 2016 onwards"},{"@type":"PropertyValue","name":"HSN Code","value":"84139190"}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Hydraulic Parts","item":"https://partstrading.com/scania/hydraulic-parts/"},{"@type":"ListItem","position":4,"name":"2536881 Gearbox Oil Pump","item":"https://partstrading.com/scania/hydraulic-parts/2536881"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 2536881?","acceptedAnswer":{"@type":"Answer","text":"Part 2536881 is the gearbox oil pump with cover for the Scania GRS905R 12-speed range-split automated transmission. It is a gear-type positive displacement pump that draws gear oil from the sump and delivers it under pressure to the lubrication gallery serving all internal bearings, gear mesh contacts, synchronizer rings, and shift rail components. Cross-references: 2409146 and 2360885."}},{"@type":"Question","name":"Which gearbox does 2536881 fit?","acceptedAnswer":{"@type":"Answer","text":"Part 2536881 is designed for the Scania GRS905R gearbox — a 12-speed range-split transmission used in Scania NTG (New Truck Generation) G, P, R, T, L, and S Series trucks built from 2016 onwards. Always verify against your gearbox serial number and ECU identifier via SDP3 before ordering."}},{"@type":"Question","name":"What are the cross-reference numbers for 2536881?","acceptedAnswer":{"@type":"Answer","text":"Part 2536881 supersedes or cross-references Scania part numbers 2409146 and 2360885. All three numbers refer to the same gear oil pump with cover assembly for the GRS905R transmission. When searching supplier databases, use all three numbers to find the widest availability."}},{"@type":"Question","name":"What symptoms indicate a failing gearbox oil pump on the GRS905R?","acceptedAnswer":{"@type":"Answer","text":"A failing GRS905R oil pump produces: increased gearbox operating noise (whining or rumbling from unlubricated bearings), elevated gearbox oil temperature warning on the instrument cluster, metal particle contamination visible when draining gear oil, Opticruise fault codes relating to gearbox temperature or shift quality, and in severe cases, difficulty selecting gears or missed shifts. Catching pump wear early prevents catastrophic gear damage."}},{"@type":"Question","name":"Does the oil pump drive off the engine or the gearbox input shaft?","acceptedAnswer":{"@type":"Answer","text":"The GRS905R oil pump is driven off the gearbox input shaft — it spins whenever the engine is running and the clutch is engaged. At idle it delivers minimum flow; at highway cruise speeds it delivers maximum flow. This means oil circulation stops when the engine is off, which is why cold starts with degraded oil cause the most wear."}},{"@type":"Question","name":"Why does the oil pump come with a cover?","acceptedAnswer":{"@type":"Answer","text":"The cover (sometimes called the pump housing cover or end plate) is the precision-machined mating face that seals the pump gear cavity. The clearance between the pump gears and the cover face is critical — typically less than 0.05 mm. A worn or scored cover allows oil to bypass internally, dropping delivery pressure without the pump itself failing. Replacing pump and cover together ensures correct clearances and restores full pressure."}},{"@type":"Question","name":"What gear oil does the GRS905R use?","acceptedAnswer":{"@type":"Answer","text":"Scania specifies Scania STO 1:0 gearbox oil for the GRS905R. This is a synthetic transmission fluid developed specifically for Scania automated gearboxes. Capacity is approximately 9–11 litres depending on configuration. Do not use generic ATF or GL-4/GL-5 gear oils — incorrect viscosity damages the oil pump and shortens synchronizer life."}},{"@type":"Question","name":"Can I replace the oil pump without removing the gearbox?","acceptedAnswer":{"@type":"Answer","text":"No. The GRS905R oil pump is mounted internally within the gearbox casing. Full gearbox removal from the vehicle is required to access it. On a workshop ramp this is a significant job — typically 6–8 hours including oil drain, driveshaft disconnect, bell housing separation, and gearbox extraction using a transmission jack."}},{"@type":"Question","name":"How do I confirm the oil pump is faulty before buying 2536881?","acceptedAnswer":{"@type":"Answer","text":"Before condemning the pump: (1) Drain and inspect the oil — heavy metal swarf (bright silver flakes) confirms internal wear. (2) Check oil level — a low level causes pump cavitation and noise. (3) Read SDP3 fault codes — gearbox overtemperature or lube pressure codes point to pump failure. (4) Remove the gearbox and inspect the pump visually — measure gear-to-cover clearance with feeler gauges."}},{"@type":"Question","name":"Can PTC supply 2536881 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Gearbox pumps are packaged in rigid foam-lined cartons to prevent transit damage to the precision cover face. Full export documentation, GST invoice, and HS Code 84139190 provided."}}]},{"@type":"HowTo","name":"How to Replace Scania GRS905R Gearbox Oil Pump 2536881","totalTime":"PT8H","step":[{"@type":"HowToStep","position":1,"name":"Drain oil and disconnect driveshaft","text":"Drain GRS905R gearbox oil via the drain plug — capture in a clean container and inspect for metal swarf. Disconnect propeller shaft from gearbox output flange and support with a strap."},{"@type":"HowToStep","position":2,"name":"Detach and extract gearbox","text":"Disconnect gear selector linkage, Opticruise shift actuator connectors, and all oil cooler lines. Support gearbox on a transmission jack. Undo bell housing bolts and slide gearbox rearward clear of the input shaft."},{"@type":"HowToStep","position":3,"name":"Access and remove oil pump","text":"With gearbox on bench, remove pump cover bolts in sequence. Withdraw the oil pump assembly and cover as a unit. Note orientation for refitting."},{"@type":"HowToStep","position":4,"name":"Install new pump assembly 2536881","text":"Fit new pump assembly with new cover. Torque cover bolts to Scania specification. Verify pump gear rotates freely by hand before closing up."},{"@type":"HowToStep","position":5,"name":"Refit gearbox and fill oil","text":"Reinstall gearbox, reconnect all actuators and lines. Fill with Scania STO 1:0 to the correct level. Start engine, check for leaks, clear SDP3 fault codes, and verify gearbox temperature settles within normal range on a test drive."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania GRS905R Gearbox Oil Pump with Cover 2536881","url":"https://partstrading.com/scania/hydraulic-parts/2536881","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>

window.PTC_CUSTOM_SECTIONS=function(){
  return SEC('sec-what','01','Gearbox Internals','What the GRS905R Oil Pump Does','The component that keeps every gear tooth alive.','<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8;margin-bottom:20px">The Scania GRS905R is a 12-speed range-split automated transmission. Inside it, dozens of precision gear teeth, synchronizer rings, needle roller bearings, and shift forks are in constant motion. None of these components can tolerate contact without a continuous film of pressurised gear oil between the surfaces.</p>'

  +SEC('sec-circuit','06','How It Works','The GRS905R Lubrication Circuit','Understanding oil flow makes diagnosis and repair faster.','<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8;margin-bottom:24px">The GRS905R lubrication circuit is a forced-flow system — unlike the splash lubrication used in some older manual gearboxes, every internal component receives pressurised oil delivered through drilled galleries.</p>'

  +SEC('sec-faq','09','FAQ','Frequently Asked Questions','','<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What is Scania part 2536881?</span><span class="faq-icon">+</span></div><div class="faq-a">Part 2536881 is the gearbox oil pump with cover for the Scania GRS905R 12-speed range-split automated gearbox. It is a gear-type positive displacement pump that circulates Scania STO 1:0 gear oil under pressure to all internal bearings, gear contacts, synchronizer rings, and shift forks. Cross-references: 2409146 and 2360885.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What are the cross-reference numbers for 2536881?</span><span class="faq-icon">+</span></div><div class="faq-a">Part 2536881 supersedes earlier Scania part numbers 2409146 and 2360885. All three numbers refer to the same gearbox oil pump with cover assembly for the GRS905R. When searching supplier databases, use all three numbers to find the widest stock availability.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">Which Scania trucks use the GRS905R gearbox?</span><span class="faq-icon">+</span></div><div class="faq-a">The GRS905R is fitted to Scania NTG (New Truck Generation) S, R, G, P, L, and T Series trucks built from 2016 onwards. It is the 12-speed range-split transmission offered in both Opticruise automated and manual shifting versions. Always verify the gearbox model via the serial plate on the gearbox casing before ordering.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">Why does the pump come with a cover?</span><span class="faq-icon">+</span></div><div class="faq-a">The cover plate seals the pump gear cavity and creates the pressure differential that drives oil circulation. The clearance between the rotating pump gears and the cover face must be less than 0.05 mm. A worn or scored cover allows oil to bypass internally, dropping delivery pressure even if the pump gears themselves are healthy. Supplying pump and cover as one assembly ensures correct clearances from first installation.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What symptoms indicate a failing GRS905R oil pump?</span><span class="faq-icon">+</span></div><div class="faq-a">A failing oil pump typically causes: increased gearbox noise (whining or howling), elevated gearbox operating temperature (instrument cluster warning or SDP3 fault code), metal particle contamination visible when draining gear oil, and progressive deterioration in Opticruise shift quality. In severe cases, gear engagement difficulty or missed shifts occur as synchronizers and selector forks are damaged.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What gear oil does the GRS905R require?</span><span class="faq-icon">+</span></div><div class="faq-a">Scania specifies Scania STO 1:0 synthetic transmission oil for the GRS905R. This is a dedicated formula developed for Scania automated gearboxes — do not substitute with standard GL-4, GL-5, or generic ATF fluids, as incorrect viscosity and additive packages accelerate wear on synchronizers and the oil pump itself. Capacity is approximately 9–11 litres depending on configuration.</div></div>'
  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">Can I replace the oil pump without removing the gearbox?</span><span class="faq-icon">+</span></div><div class="faq-a">No. The GRS905R oil pump is mounted internally within the gearbox casing and is not accessible without full gearbox removal from the vehicle. Allow 6–8 hours on a properly equipped ramp for oil drain, driveshaft disconnect, Opticruise actuator disconnection, bell housing separation, and gearbox extraction using a transmission jack.</div></div>'

var currentImg=0;
function setImg(i){currentImg=i;var el=document.getElementById('mainImg');if(el){el.src=IMAGES[i][0];el.alt=IMAGES[i][1];}document.querySelectorAll('.thumb').forEach(function(t,idx){t.classList.toggle('active',idx===i);});}
function openLightbox(src){var lb=document.getElementById('lightbox');var img=document.getElementById('lightboxImg');if(!lb||!img)return;img.src=src;img.alt=IMAGES[currentImg][1];lb.classList.add('open');document.body.style.overflow='hidden';}
function closeLightbox(e){if(e.target===document.getElementById('lightbox')){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}}
function lbNav(dir){var next=(currentImg+dir+IMAGES.length)%IMAGES.length;setImg(next);var img=document.getElementById('lightboxImg');if(img){img.src=IMAGES[next][0];img.alt=IMAGES[next][1];}}
function toggleFaq(el){var item=el.parentElement;item.classList.toggle('open');}
document.querySelectorAll('.thumb').forEach(function(t){t.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();t.click();}});});
</script>
</body>
</html>
