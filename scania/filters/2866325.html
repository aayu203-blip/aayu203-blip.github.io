:{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Scania Filters","item":"https://partstrading.com/scania/filters/"},{"@type":"ListItem","position":4,"name":"2866325 Filter Kit L","item":"https://partstrading.com/scania/filters/2866325"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 2866325?","acceptedAnswer":{"@type":"Answer","text":"Part 2866325 is the Scania Filter Kit L — a complete set of filters for the L-service (major scheduled maintenance interval) on Scania D9 and D13 PDE engines. It supersedes the original Scania part number 2113564. Both numbers refer to the same kit. Kit weight is 4.08 kg."}},{"@type":"Question","name":"What is the difference between 2866325 and 2113564?","acceptedAnswer":{"@type":"Answer","text":"2113564 is the original Scania OEM part number for the Filter Kit L. 2866325 is the later supersession number — both describe the identical complete L-service filter set for D9 and D13 PDE engines. PTC stocks both references and can supply the correct kit under either number."}},{"@type":"Question","name":"Which Scania engines use Filter Kit L 2866325?","acceptedAnswer":{"@type":"Answer","text":"Filter Kit L 2866325 is designed for the Scania D9 PDE and D13 PDE (pump-duct injector / unit injector) engines. These six-cylinder inline engines were fitted to Scania P, G, R and T Series trucks built from 2003 to 2018. They are NOT compatible with XPI (common rail) engine variants introduced after 2011."}},{"@type":"Question","name":"What does an L service mean on Scania trucks?","acceptedAnswer":{"@type":"Answer","text":"Scania uses a multi-tier service system. The S (small) service covers short intervals — typically engine oil and oil filter only. The L (large) service is the major scheduled interval — it replaces all filters in the kit: engine oil filter, fuel filter, coolant filter, and air filter elements. The L service interval is typically every 150,000 km or 12 months, depending on operating conditions."}},{"@type":"Question","name":"What filters are included in Scania Filter Kit L 2866325?","acceptedAnswer":{"@type":"Answer","text":"The L kit covers all filters changed at the Scania major service interval for D9 and D13 PDE engines. WhatsApp us with your chassis serial number and we will confirm the exact filter types included for your specific engine variant — D9 and D13 have slightly different filter configurations."}},{"@type":"Question","name":"Is 2866325 compatible with D13 XPI (common rail) engines?","acceptedAnswer":{"@type":"Answer","text":"No. Filter Kit L 2866325 is specifically for the D13 PDE (unit injector) engine, not the D13 XPI (common rail) variant. The XPI engine uses different fuel filter elements suited to the higher-pressure common rail system. Always confirm engine type — PDE or XPI — before ordering."}},{"@type":"Question","name":"Can I mix brands within the filter kit?","acceptedAnswer":{"@type":"Answer","text":"It is possible but not recommended. The L kit is designed as a complete matched set where all filters meet Scania's service specifications simultaneously. Mixing OEM-spec filters with generic alternatives means one filter in the set may fall below specification while others do not — creating uneven protection. Fit all filters in the kit at the same service."}},{"@type":"Question","name":"How should I store Scania filter kits before fitting?","acceptedAnswer":{"@type":"Answer","text":"Store filter kits in original packaging in a cool, dry environment away from ozone sources (electric motors, UV lights). Filter media and rubber seals degrade in UV light and ozone. Do not store near solvents or fuels — rubber seals absorb hydrocarbons and swell. Shelf life is typically 3–5 years from manufacture in proper storage."}},{"@type":"Question","name":"Can PTC supply 2866325 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Filter kits are compact and airfreight efficiently for urgent orders. Full export documentation provided — commercial invoice, packing list, certificate of origin."}},{"@type":"Question","name":"Is 2866325 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket Filter Kit L for 2866325, manufactured to Scania's filtration specifications for D9 and D13 PDE engines. Genuine Scania units are available on request."}}]},{"@type":"HowTo","name":"How to Perform an L-Service Filter Change — Scania D9 D13 PDE","totalTime":"PT180M","step":[{"@type":"HowToStep","position":1,"name":"Prepare — drain hot oil safely","text":"Run the engine to operating temperature first — warm oil drains faster and more completely. Park on level ground. Apply park brake. Place drain container under sump drain plug. Drain completely."},{"@type":"HowToStep","position":2,"name":"Replace engine oil filter","text":"Remove the old oil filter. Clean the filter head mating face. Apply a thin film of clean oil to the new filter's rubber seal. Fit new filter and tighten by hand until the seal contacts the head, then 3/4 turn further — do not use a strap wrench to over-tighten."},{"@type":"HowToStep","position":3,"name":"Replace fuel filter(s)","text":"Pre-fill the new fuel filter with clean diesel before fitting to reduce prime time. Bleed the fuel system after fitting per Scania WTM procedure."},{"@type":"HowToStep","position":4,"name":"Replace air filter element and separator","text":"Remove the air filter housing and replace the main element and safety element if included in the kit. Clean the housing before fitting the new element. Check all housing seals."},{"@type":"HowToStep","position":5,"name":"Fill with correct engine oil and check coolant","text":"Fill with Scania-approved engine oil to the correct level. Check coolant inhibitor concentration. Record service date, mileage, and part numbers used in the service history."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania Filter Kit L 2866325 — D9 D13 PDE Engines","url":"https://partstrading.com/scania/filters/2866325","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>
