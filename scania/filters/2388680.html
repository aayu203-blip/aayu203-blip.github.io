  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Scania 2388680 Universal Joint Cross — P50 Propeller Shaft","alternateName":["Scania 1541071 UJ Cross","Scania 1766467 Universal Joint","Scania 1797425 UJ Spider","Scania P50 Propshaft Cross"],"description":"OEM-specification universal joint cross (UJ cross / spider) for the Scania P50 heavy-duty propeller shaft series. Journal diameter 57 mm, ear-to-ear length 164 mm. Needle roller bearing design with grease nipple. Cross-references: 1541071, 1766467, 1797425. Replaces the cross in the rear propeller shaft on heavy Scania truck configurations.","mpn":"2388680","sku":"2388680","image":["https://partstrading.com/assets/images/parts/filtration.jpg"],"brand":{"@type":"Brand","name":"Scania"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"2388680"},{"@type":"PropertyValue","name":"Cross-References","value":"1541071, 1766467, 1797425"},{"@type":"PropertyValue","name":"Component Type","value":"Universal Joint Cross (UJ Spider)"},{"@type":"PropertyValue","name":"Propshaft Series","value":"Scania P50"},{"@type":"PropertyValue","name":"Journal Diameter","value":"57 mm"},{"@type":"PropertyValue","name":"Ear-to-Ear Length (OAL)","value":"164 mm"},{"@type":"PropertyValue","name":"Bearing Type","value":"Needle roller bearing with grease nipple"}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Drivetrain Parts","item":"https://partstrading.com/scania/filters/"},{"@type":"ListItem","position":4,"name":"2388680 UJ Cross P50","item":"https://partstrading.com/scania/filters/2388680"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 2388680?","acceptedAnswer":{"@type":"Answer","text":"Part 2388680 is a universal joint cross (also called a UJ spider or cross-journal) for the Scania P50 heavy-duty propeller shaft series. It is the forged steel cross body that carries four needle roller bearing caps inside the yoke ears of the propeller shaft. Journal diameter is 57 mm, ear-to-ear length is 164 mm."}},{"@type":"Question","name":"What cross-references apply to 2388680?","acceptedAnswer":{"@type":"Answer","text":"Scania part 2388680 crosses to: 1541071, 1766467, and 1797425 — all are earlier or alternative Scania OEM part numbers for the same P50 UJ cross with 57mm journal and 164mm length. PTC can supply against any of these numbers."}},{"@type":"Question","name":"What does 57mm journal diameter mean on a UJ cross?","acceptedAnswer":{"@type":"Answer","text":"The journal diameter (57 mm) is the diameter of each trunnion pin — the four cylindrical pins that extend from the cross body, one in each direction. The needle roller bearing cap fits over this pin. Measuring 57mm across the journal confirms correct part sizing. The wrong journal diameter means the bearing cap bore will not fit correctly — the joint will fail immediately."}},{"@type":"Question","name":"What vehicles use the Scania P50 propshaft and part 2388680?","acceptedAnswer":{"@type":"Answer","text":"The P50 propshaft series is the heavy-duty rear propeller shaft specification used on heavier Scania truck configurations — typically 6×4 and 8×4 axle configurations in the G, R and heavy P Series. Confirm by measuring the existing cross: journal 57mm, length 164mm, or by quoting your chassis serial number to PTC."}},{"@type":"Question","name":"When should I replace the UJ cross 2388680?","acceptedAnswer":{"@type":"Answer","text":"Replace when: visible pitting or corrosion on the journal surfaces; stiffness when manually rotating the joint through its arc; any measurable play between the cross and the bearing cap (needle rollers worn or missing); vibration at drivetrain speed that increases with road speed; grease nipple will not accept grease (blocked by dried lubricant). Under-greasing is the leading cause of premature UJ failure."}},{"@type":"Question","name":"How do I replace a UJ cross on a Scania propshaft?","acceptedAnswer":{"@type":"Answer","text":"Remove the propshaft from the vehicle. Use circlip pliers to remove all four bearing cap circlips. Press each bearing cap out using a press and suitably sized sockets (one to push, one to receive). Remove the cross. Clean the yoke bores thoroughly. Fit new bearing caps with new cross using the press — never hammer as this damages needle rollers. Fit circlips. Grease the new cross immediately through the nipple."}},{"@type":"Question","name":"How often should I grease UJ cross 2388680?","acceptedAnswer":{"@type":"Answer","text":"Grease the UJ cross every 20,000–50,000 km with NLGI 2 EP (extreme pressure) grease, or per the Scania maintenance schedule for your truck. Apply grease until fresh grease emerges from all four bearing cap seals. A blocked cap — where grease does not emerge — indicates a seized needle roller pack that will fail shortly."}},{"@type":"Question","name":"Can PTC supply 2388680 to UAE or Africa?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. UJ crosses are small and airfreight efficiently for urgent breakdown orders."}},{"@type":"Question","name":"Is 2388680 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket UJ crosses for 2388680, manufactured to the P50 propshaft journal diameter (57mm) and length (164mm) specifications. Correct needle roller count and bearing cap bore tolerance verified."}},{"@type":"Question","name":"What is the difference between P50 and smaller Scania propshaft series?","acceptedAnswer":{"@type":"Answer","text":"Scania propeller shafts are classified by load rating — the P50 is the heavy-duty series used on 6×4 and 8×4 trucks. Lighter P-series trucks may use a smaller-diameter propshaft with a different cross size. Always measure the existing cross (journal diameter and length) or provide the chassis serial number to confirm the correct cross for your truck."}}]},{"@type":"HowTo","name":"How to Replace a Universal Joint Cross on a Scania P50 Propeller Shaft","totalTime":"PT90M","step":[{"@type":"HowToStep","position":1,"name":"Remove propshaft from vehicle","text":"Support the shaft. Remove flange bolts at both ends. Lower the shaft carefully — P50 propshafts are heavy. Mark the phasing between shaft tube and yokes before disassembly if refitting the same shaft."},{"@type":"HowToStep","position":2,"name":"Remove bearing cap circlips","text":"Use circlip pliers to remove all four bearing cap circlips from the yoke ears. These must be fully seated in their grooves — a partially fitted circlip will allow the cap to walk out under load."},{"@type":"HowToStep","position":3,"name":"Press out old bearing caps and cross","text":"Place the yoke in a press with a suitable socket to receive the outgoing cap and a smaller socket to push. Press each cap through and out. Once two caps are removed, the cross can be tilted out of the yoke."},{"@type":"HowToStep","position":4,"name":"Clean yoke bores and fit new cross","text":"Clean the yoke ear bores. Measure bore diameter — if bell-mouthed (oversize from running dry), the yoke must be replaced. Fit new cross body. Press new bearing caps in carefully with a press until flush. Fit all four circlips — confirm fully seated."},{"@type":"HowToStep","position":5,"name":"Grease and refit propshaft","text":"Grease the new cross immediately through the nipple until fresh grease exits all four cap seals. Refit propshaft to vehicle, torque all flange bolts. Road test and check for vibration."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania 2388680 Universal Joint Cross P50","url":"https://partstrading.com/scania/filters/2388680","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>
