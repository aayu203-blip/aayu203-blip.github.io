using. Cross-reference 2233597."}},{"@type":"Question","name":"What is the cross-reference for 2979070?","acceptedAnswer":{"@type":"Answer","text":"Scania 2979070 cross-references to 2233597 — an earlier Scania OEM number for the same Clutch Release Bearing Mounting Kit. PTC can supply under either number."}},{"@type":"Question","name":"What is a clutch release bearing mounting kit?","acceptedAnswer":{"@type":"Answer","text":"The mounting kit contains the components that locate and secure the clutch release bearing (throw-out bearing) in the correct position relative to the pressure plate diaphragm spring fingers. Without correct mounting, the release bearing contacts the diaphragm springs at an angle, causing uneven wear and clutch judder."}},{"@type":"Question","name":"When should I replace the clutch release bearing mounting kit?","acceptedAnswer":{"@type":"Answer","text":"Replace at every clutch replacement. The mounting kit hardware undergoes repeated thermal cycling and mechanical stress. Using old mounting hardware with a new release bearing can allow the bearing to misalign — destroying the new bearing rapidly. Always fit a complete new kit when replacing the clutch assembly."}},{"@type":"Question","name":"Which Scania trucks use part 2979070?","acceptedAnswer":{"@type":"Answer","text":"Part 2979070 is specified for Scania G, R, P, L and S Series trucks. For exact fitment confirmation, provide your chassis serial number — clutch configurations can vary across model years and powertrain combinations within the same series."}},{"@type":"Question","name":"Does the kit include the release bearing itself?","acceptedAnswer":{"@type":"Answer","text":"No. The 2979070 kit contains the mounting hardware (bracket, sleeve, and/or retaining components) but not the release bearing itself. The release bearing is a separate Scania part. Both must be replaced at clutch service — always replace them together."}},{"@type":"Question","name":"How do I know if my clutch release bearing mounting is failing?","acceptedAnswer":{"@type":"Answer","text":"Signs include: squealing or grinding noise when the clutch pedal is pressed; vibration through the pedal during clutch engagement; incomplete clutch release (gearbox will not go into gear); visible damage to the release bearing contact area on pressure plate diaphragm spring fingers."}},{"@type":"Question","name":"Can PTC supply 2979070 to UAE or Africa?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Same-day dispatch from Mumbai for orders confirmed before 3 PM IST. Full export documentation provided."}},{"@type":"Question","name":"Should I replace the clutch disc and pressure plate at the same time?","acceptedAnswer":{"@type":"Answer","text":"Yes. When the gearbox is removed to access the clutch assembly, always replace the clutch disc, pressure plate, and release bearing as a complete set — along with the mounting kit. The access cost (labour for gearbox removal) is the same whether you replace one component or all three. Replacing one component while leaving worn companions will require repeat gearbox removal shortly after."}},{"@type":"Question","name":"Is 2979070 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket Clutch Release Bearing Mounting Kits for 2979070, manufactured to Scania's fitment specifications for G, R, P, L and S Series trucks. Genuine Scania units available on request."}}]},{"@type":"HowTo","name":"How to Replace Clutch Release Bearing and Mounting Kit on Scania Trucks","totalTime":"PT240M","step":[{"@type":"HowToStep","position":1,"name":"Drain gearbox oil and remove gearbox","text":"Support the gearbox with a transmission jack. Disconnect propshaft, gearbox mounts, gear linkage, and all electrical connections. Remove gearbox-to-flywheel housing bolts. Slide gearbox back carefully — support the input shaft so it does not bear on the clutch disc centre during extraction."},{"@type":"HowToStep","position":2,"name":"Remove old clutch assembly and inspect flywheel","text":"Mark the pressure plate orientation relative to the flywheel before removal. Remove the pressure plate and clutch disc. Inspect flywheel surface — if scored or hot-spotted, machine or replace before fitting new clutch."},{"@type":"HowToStep","position":3,"name":"Fit new release bearing mounting kit","text":"Fit the new mounting kit components (2979070) — clean all mating faces. Ensure the fork or actuator sleeve locates correctly in the new mounting hardware before proceeding."},{"@type":"HowToStep","position":4,"name":"Fit new clutch disc and pressure plate","text":"Use a clutch alignment tool to centre the new disc on the flywheel before fitting the pressure plate. Fit pressure plate in same orientation as marked. Tighten bolts progressively and evenly — do not tighten one bolt fully before the others."},{"@type":"HowToStep","position":5,"name":"Refit gearbox and adjust clutch","text":"Slide gearbox input shaft carefully through clutch disc centre. Refit all gearbox bolts and reconnect all components. Adjust clutch pedal free play and release bearing clearance per Scania WTM specification for your model."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania 2979070 Clutch Release Bearing Mounting Kit","url":"https://partstrading.com/scania/filters/2979070","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>
