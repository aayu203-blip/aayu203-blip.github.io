  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Scania Gearbox Selector Piston 1779734","alternateName":["Scania 1779734 Piston Gearbox","Scania Opticruise Shift Piston 1779734","Scania GRS Gearbox Actuator Piston"],"description":"Pneumatic selector piston for Scania Opticruise automated gearboxes (GR/GRS series). The core moving element inside the pneumatic shift actuator cylinder — it transmits compressed air pressure into mechanical force on the gear selector fork. Worn pistons cause shift misfires, wrong-gear selections, and GMS fault codes. Fits Scania P, G, R, T Series with Opticruise transmission.","mpn":"1779734","sku":"1779734","image":["https://partstrading.com/assets/images/parts/transmission-parts.jpg"],"brand":{"@type":"Brand","name":"Scania"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"1779734"},{"@type":"PropertyValue","name":"Part Type","value":"Gearbox Selector Piston"},{"@type":"PropertyValue","name":"System","value":"Opticruise pneumatic shift actuator"},{"@type":"PropertyValue","name":"Compatible Gearbox","value":"Scania GR/GRS series automated gearbox"},{"@type":"PropertyValue","name":"Material","value":"Aluminium alloy with nitrile rubber seal"},{"@type":"PropertyValue","name":"Air Pressure","value":"8–10 bar"},{"@type":"PropertyValue","name":"HSN Code","value":"87089900"}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Transmission Parts","item":"https://partstrading.com/scania/transmission-parts/"},{"@type":"ListItem","position":4,"name":"1779734 Selector Piston","item":"https://partstrading.com/scania/transmission-parts/1779734"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 1779734?","acceptedAnswer":{"@type":"Answer","text":"Part 1779734 is the gearbox selector piston for the Scania Opticruise pneumatic shift actuator on GR/GRS automated gearboxes. It converts compressed air at 8–10 bar into mechanical force on the gear selector fork, completing each automatic gear change."}},{"@type":"Question","name":"Which Scania gearboxes use part 1779734?","acceptedAnswer":{"@type":"Answer","text":"Part 1779734 fits Scania GR and GRS series automated gearboxes with Opticruise shifting. This covers P, G, R, and T Series trucks across multiple generations. Verify gearbox type via the serial plate or SDP3 before ordering."}},{"@type":"Question","name":"What symptoms indicate a faulty selector piston 1779734?","acceptedAnswer":{"@type":"Answer","text":"Common symptoms: shift misfires (gear change attempted but not completed), wrong gear selected, slow sluggish gear changes, SDP3 GMS fault codes for actuator performance or position sensor disagreement, and in severe cases fixed-gear limp mode with the Opticruise warning light illuminated."}},{"@type":"Question","name":"How does the Opticruise pneumatic shift actuator work?","acceptedAnswer":{"@type":"Answer","text":"The GMS ECU opens a solenoid valve that routes compressed air at 8–10 bar into the actuator cylinder. The pressure differential moves the selector piston through the bore. The piston rod pushes the selector fork into the target gear. A position sensor confirms engagement; the GMS completes clutch engagement and resumes torque delivery."}},{"@type":"Question","name":"What causes selector piston failure?","acceptedAnswer":{"@type":"Answer","text":"Main causes: (1) Nitrile seal wear from heat cycling; (2) Bore scoring from moisture or oil in the compressed air supply; (3) Corrosion seizure from wet air; (4) Piston body cracking from fatigue. A serviceable air dryer with clean, dry air significantly extends piston life."}},{"@type":"Question","name":"Can I replace just the piston seal?","acceptedAnswer":{"@type":"Answer","text":"If the piston body is undamaged and the bore is unscored, seal-only replacement is viable. Part 1779734 is the complete piston assembly for cases where the body is damaged. Always inspect bore diameter before deciding — a scored bore destroys new seals rapidly."}},{"@type":"Question","name":"How do I identify which actuator has failed?","acceptedAnswer":{"@type":"Answer","text":"Connect SDP3 and read active GMS fault codes — the system identifies the affected actuator circuit (main box, range, or splitter). To confirm mechanically: with air pressure connected, energise each solenoid via SDP3 actuator test and observe piston travel. Zero or weak travel isolates the faulty actuator."}},{"@type":"Question","name":"Is air supply quality important?","acceptedAnswer":{"@type":"Answer","text":"Critically. Moisture corrodes the bore and degrades seals rapidly. Oil from a worn compressor swells nitrile seals. The air dryer must be serviceable before fitting a new piston — a new piston in a contaminated air circuit fails prematurely."}},{"@type":"Question","name":"What other parts should I check alongside the piston?","acceptedAnswer":{"@type":"Answer","text":"Inspect: selector fork tips for wear, solenoid valve for correct operation, cylinder bore for scoring, and air supply line for moisture or oil. If misfiring has been prolonged, check synchronizer rings for accelerated wear."}},{"@type":"Question","name":"Can PTC supply 1779734 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Full export documentation, GST invoice, and HS Code 87089900 provided."}}]},{"@type":"HowTo","name":"How to Replace Scania Opticruise Selector Piston 1779734","totalTime":"PT3H","step":[{"@type":"HowToStep","position":1,"name":"Isolate air and depressurise","text":"Drain vehicle air system to zero pressure. Photograph all actuator air line connections — incorrect reconnection reverses shift direction."},{"@type":"HowToStep","position":2,"name":"Access the shift actuator","text":"Locate the actuator for the faulty circuit. Some are accessible on-vehicle; others require gearbox removal. Consult Scania workshop manual before committing."},{"@type":"HowToStep","position":3,"name":"Extract and inspect piston","text":"Remove the actuator end cap and extract piston 1779734. Inspect for cracks. Measure bore — if scored, the cylinder must also be replaced."},{"@type":"HowToStep","position":4,"name":"Fit new piston 1779734","text":"Lightly lubricate new seals with silicone grease or clean air-tool oil. Do not use petroleum grease — it swells nitrile seals. Insert piston without rolling seal lips."},{"@type":"HowToStep","position":5,"name":"Test, clear codes, road test","text":"Build air pressure and verify full stroke both directions via SDP3 actuator test. Clear all GMS fault codes. Road test over all gears before returning to service."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania Gearbox Selector Piston 1779734","url":"https://partstrading.com/scania/transmission-parts/1779734","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>
