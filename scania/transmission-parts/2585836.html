  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Scania 2585836 Gearbox Speed Sensor T129","alternateName":["Scania T129 Speed Sensor","Scania GMS Output Shaft Sensor 2585836","Scania Gearbox Sensor 2585836"],"description":"Gearbox output shaft speed sensor for Scania G, R, P, L and S Series trucks. Part 2585836 is the T129-type sensor that measures the rotational speed of the gearbox output shaft and feeds this signal to the Scania GMS (Gear Management System) ECU. Used for vehicle speed calculation, gear selection assistance, and tachograph input. Threaded directly into the gearbox housing at the output shaft.","mpn":"2585836","sku":"2585836","image":["https://partstrading.com/assets/images/parts/transmission.jpg"],"brand":{"@type":"Brand","name":"Scania"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"2585836"},{"@type":"PropertyValue","name":"Sensor Type","value":"T129 — Gearbox Output Shaft Speed Sensor"},{"@type":"PropertyValue","name":"System","value":"Scania GMS (Gear Management System)"},{"@type":"PropertyValue","name":"Location","value":"Threaded into gearbox housing at output shaft"},{"@type":"PropertyValue","name":"Compatible Trucks","value":"Scania G, R, P, L, S Series"}]},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Transmission Parts","item":"https://partstrading.com/scania/transmission-parts/"},{"@type":"ListItem","position":4,"name":"2585836 Gearbox Speed Sensor T129","item":"https://partstrading.com/scania/transmission-parts/2585836"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 2585836?","acceptedAnswer":{"@type":"Answer","text":"Part 2585836 is the T129-type Gearbox Speed Sensor for Scania G, R, P, L and S Series trucks. It measures the rotational speed of the gearbox output shaft and sends this signal to the Scania GMS (Gear Management System) ECU. The signal is used for vehicle speed calculation, automatic gear selection assistance, and tachograph input."}},{"@type":"Question","name":"What is a T129 sensor?","acceptedAnswer":{"@type":"Answer","text":"T129 is a sensor type designation used in the Scania parts system — it refers to a specific speed sensor configuration (connector type, body size, and sensing technology) used at the gearbox output shaft position. The Scania part number 2585836 identifies this specific sensor for ordering purposes."}},{"@type":"Question","name":"What symptoms occur when gearbox speed sensor 2585836 fails?","acceptedAnswer":{"@type":"Answer","text":"A failed gearbox speed sensor typically causes: no vehicle speed reading on the dashboard; tachograph not recording speed; GMS fault codes logged (scan with Scania SDP3 or equivalent); on automated gearboxes, the Opticruise/GRS system may refuse to upshift or may lock in a safe gear; cruise control may become inoperative."}},{"@type":"Question","name":"How do I test gearbox speed sensor 2585836?","acceptedAnswer":{"@type":"Answer","text":"With the sensor disconnected and multimeter set to AC voltage, rotate the gearbox output (with truck raised and transmission in neutral), and the sensor should produce a small AC voltage signal as the reluctor wheel teeth pass. No signal indicates a failed sensor. Also check the reluctor wheel for missing or damaged teeth, and check wiring connector for corrosion."}},{"@type":"Question","name":"Where is gearbox speed sensor 2585836 located?","acceptedAnswer":{"@type":"Answer","text":"The sensor is threaded into the gearbox housing at the output shaft, typically accessible from the underside of the vehicle or from the rear of the gearbox. The exact position varies by gearbox model. On GRS-series gearboxes, it is usually on the output shaft housing near the propshaft flange."}},{"@type":"Question","name":"Which gearboxes and trucks use sensor 2585836?","acceptedAnswer":{"@type":"Answer","text":"Sensor 2585836 is for Scania G, R, P, L and S Series trucks. Provide your gearbox type or chassis serial number to PTC for exact fitment confirmation — multiple sensor positions may exist on automated gearboxes."}},{"@type":"Question","name":"Can I replace just the speed sensor or do I need to remove the gearbox?","acceptedAnswer":{"@type":"Answer","text":"In most cases, the speed sensor can be replaced with the gearbox in-situ — it is a threaded sensor that can be unscrewed and replaced in under an hour without gearbox removal. Always drain some gearbox oil first to prevent oil loss when the sensor is removed, or have a plug ready to minimise spill."}},{"@type":"Question","name":"Can PTC supply 2585836 to UAE or Africa?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Speed sensors are compact and airfreight efficiently for urgent breakdown orders."}},{"@type":"Question","name":"Do I need to clear fault codes after replacing the sensor?","acceptedAnswer":{"@type":"Answer","text":"Yes. After fitting the new sensor, use a Scania diagnostic tool (SDP3) or a compatible dealer scanner to clear all stored GMS fault codes. The ECU may not resume normal operation until the codes are cleared, even if the sensor is functioning correctly."}},{"@type":"Question","name":"Is 2585836 OEM or aftermarket?","acceptedAnswer":{"@type":"Answer","text":"PTC supplies OEM-specification aftermarket gearbox speed sensors for 2585836, manufactured to the T129 specification for Scania GMS-connected applications. Genuine Scania units available on request."}}]},{"@type":"HowTo","name":"How to Replace Gearbox Speed Sensor 2585836 on Scania Trucks","totalTime":"PT60M","step":[{"@type":"HowToStep","position":1,"name":"Locate and access the sensor","text":"Identify the sensor location on your gearbox model — typically threaded into the output shaft housing. Raise the vehicle on stands for better access if needed. Have a clean container and rag ready to catch gearbox oil."},{"@type":"HowToStep","position":2,"name":"Disconnect the wiring connector","text":"Disconnect the electrical connector from the sensor. Inspect connector pins and socket for corrosion — corroded contacts are a common cause of intermittent sensor faults. Clean if necessary."},{"@type":"HowToStep","position":3,"name":"Remove old sensor","text":"Using the correct socket size, unscrew the old sensor. Have a rag ready — a small amount of gearbox oil will escape. If the sensor thread is seized, apply penetrating oil and gentle heat before forcing."},{"@type":"HowToStep","position":4,"name":"Inspect reluctor wheel","text":"With the sensor removed, shine a torch into the sensor bore to inspect the reluctor wheel — the toothed steel wheel whose teeth pass the sensor tip. Check for missing, cracked, or damaged teeth. A damaged reluctor wheel will give an intermittent signal even with a new sensor."},{"@type":"HowToStep","position":5,"name":"Fit new sensor and reconnect","text":"Fit new sensor with thread sealant if required by the gearbox specification. Torque to specification — do not over-tighten as sensor bodies can crack. Reconnect wiring connector. Top up gearbox oil to correct level. Clear GMS fault codes with diagnostic tool. Road test to confirm speed signal is present on dashboard and tachograph."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania 2585836 Gearbox Speed Sensor T129","url":"https://partstrading.com/scania/transmission-parts/2585836","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickre
