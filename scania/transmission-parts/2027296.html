  <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Product","name":"Scania Rear Axle Cassette Hub Seal 2027296","alternateName":["Scania 2027296 Cassette Axle Gear","Scania Hub Oil Seal 2027296","Scania 2027296 Axle Hub Cassette"],"description":"Pre-assembled cassette-type lip oil seal for the Scania rear axle wheel hub. The cassette integrates the seal lip, garter spring, outer case, and debris excluder into a factory-aligned unit, eliminating misaligned installation. Prevents axle oil migrating past the hub and contaminating brake linings. Fits Scania G, R, P, S Series trucks with hub reduction rear axles.","mpn":"2027296","sku":"2027296","image":["https://partstrading.com/assets/images/parts/gearbox-differential.jpg"],"brand":{"@type":"Brand","name":"Scania"},"itemCondition":"https://schema.org/NewCondition","additionalProperty":[{"@type":"PropertyValue","name":"OEM Part Number","value":"2027296"},{"@type":"PropertyValue","name":"Part Type","value":"Cassette-type axle hub oil seal"},{"@type":"PropertyValue","name":"Seal Design","value":"Pre-assembled cassette (lip + case + spring + excluder)"},{"@type":"PropertyValue","name":"Application","value":"Scania rear axle wheel hub"},{"@type":"PropertyValue","name":"Compatible Series","value":"Scania G, R, P, S Series — G410, G440, R410, R450"},{"@type":"PropertyValue","name":"HSN Code","value":"40169960"}],"offers":{"@type":"Offer","availability":"https://schema.org/InStock","seller":{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com"},"shippingDetails":{"@type":"OfferShippingDetails","shippingDestination":[{"@type":"DefinedRegion","addressCountry":"IN"},{"@type":"DefinedRegion","addressCountry":"AE"},{"@type":"DefinedRegion","addressCountry":"SA"},{"@type":"DefinedRegion","addressCountry":"NG"},{"@type":"DefinedRegion","addressCountry":"KE"}],"deliveryTime":{"@type":"ShippingDeliveryTime","handlingTime":{"@type":"QuantitativeValue","minValue":0,"maxValue":1,"unitCode":"DAY"},"transitTime":{"@type":"QuantitativeValue","minValue":1,"maxValue":14,"unitCode":"DAY"}}}}},{"@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://partstrading.com/"},{"@type":"ListItem","position":2,"name":"Scania Parts","item":"https://partstrading.com/scania/"},{"@type":"ListItem","position":3,"name":"Transmission Parts","item":"https://partstrading.com/scania/transmission-parts/"},{"@type":"ListItem","position":4,"name":"2027296 Cassette Hub Seal","item":"https://partstrading.com/scania/transmission-parts/2027296"}]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What is Scania part 2027296?","acceptedAnswer":{"@type":"Answer","text":"Part 2027296 is the cassette-type oil seal for the Scania rear axle wheel hub. A pre-assembled unit combining the primary lip seal, garter spring, outer metal case, and debris excluder — all factory-aligned. It prevents axle oil from migrating past the hub and contaminating brake linings. Fits Scania G, R, P, S Series trucks with hub reduction rear axles."}},{"@type":"Question","name":"What is a cassette seal versus a conventional lip seal?","acceptedAnswer":{"@type":"Answer","text":"A conventional lip seal is a single-lip ring that must be installed to exact depth and perfectly perpendicular. A cassette seal is pre-assembled — the lip, garter spring, outer case, and debris excluder are factory-aligned. The cassette presses flush to the hub face and self-aligns, eliminating the most common installation errors."}},{"@type":"Question","name":"What symptoms indicate a failing Scania hub cassette seal?","acceptedAnswer":{"@type":"Answer","text":"Symptoms: oil wet patch or streak running from the hub face down the wheel (visible with wheel removed), oily or glazed brake linings, low rear axle oil level on periodic check, and visible oil on the inner wheel face in advanced cases. Oil-contaminated brake linings are a safety-critical condition."}},{"@type":"Question","name":"Can a leaking hub seal contaminate the brakes?","acceptedAnswer":{"@type":"Answer","text":"Yes — this is the critical safety consequence. Axle oil migrating past the hub seal reaches the brake drum and linings. Oil-saturated linings have dramatically reduced friction coefficient — braking force on that wheel drops sharply, causing dangerous side-to-side braking imbalance. The linings must be replaced (not cleaned) when the seal is replaced."}},{"@type":"Question","name":"How often should hub seals be replaced?","acceptedAnswer":{"@type":"Answer","text":"Cassette hub seals are replaced when leaking. However, during any axle rebuild or hub removal for bearing replacement, fit a new seal as a matter of course — a disturbed seal may not reseal reliably even if it was not previously leaking."}},{"@type":"Question","name":"What axle oil does the Scania rear axle use?","acceptedAnswer":{"@type":"Answer","text":"Scania specifies Scania Axle Fluid (SAF) for rear axles with limited-slip differential, and Scania Gear Oil for standard open differentials. OEM-specification seals use a compound resistant to SAF degradation. Do not use conventional motor oil — it degrades seal compounds."}},{"@type":"Question","name":"Do I need to replace the hub bearing at the same time?","acceptedAnswer":{"@type":"Answer","text":"Not always, but always inspect it with the hub removed. If bearing play is near the service limit, fit a new bearing while the hub is already disassembled — it avoids a second hub removal within a short period. Measure radial play before deciding."}},{"@type":"Question","name":"Can I reuse the old seal if it is not leaking?","acceptedAnswer":{"@type":"Answer","text":"No. Once a cassette seal is extracted, its outer case is permanently deformed. Refitting a used cassette will leak immediately or within a short distance. Always fit a new seal after any hub disassembly."}},{"@type":"Question","name":"What causes hub seals to fail prematurely?","acceptedAnswer":{"@type":"Answer","text":"Causes: (1) Worn or rough stub axle running surface — scores the seal lip; (2) Incorrect installation depth; (3) Overfilled axle — excessive internal pressure; (4) Wrong oil specification; (5) Missing or damaged debris excluder allowing grit to reach the primary lip. Inspect the stub axle before fitting any new seal."}},{"@type":"Question","name":"Can PTC supply 2027296 to UAE, Nigeria, or Kenya?","acceptedAnswer":{"@type":"Answer","text":"Yes. PTC ships from Mumbai to UAE, Nigeria, Kenya, Saudi Arabia, South Africa, and 40+ countries. Full export documentation, GST invoice, and HS Code 40169960 provided."}}]},{"@type":"HowTo","name":"How to Replace Scania Rear Axle Cassette Hub Seal 2027296","totalTime":"PT2H","step":[{"@type":"HowToStep","position":1,"name":"Drain axle oil and remove wheel","text":"Drain rear axle oil from the differential drain plug. Remove the road wheel and brake drum. Note drained oil volume — significantly less than expected confirms a hub seal has been the source of oil loss."},{"@type":"HowToStep","position":2,"name":"Remove hub and inspect stub axle","text":"Remove hub cap, split pin, and hub nut. Extract the hub assembly. Inspect the stub axle running surface — a wear groove requires repair (fine dress with emery cloth or fit a wear sleeve) before installing a new seal."},{"@type":"HowToStep","position":3,"name":"Extract old cassette and prepare bore","text":"Use a seal puller to extract the old cassette. Clean the hub bore — remove all corrosion and old sealant. A damaged bore prevents the new cassette from achieving correct interference fit."},{"@type":"HowToStep","position":4,"name":"Press in new cassette 2027296","text":"Coat the outer case lightly with clean axle oil. Using the correct size driver, press the cassette flush with the hub face. Do not drive below flush. Never hammer directly on the cassette face."},{"@type":"HowToStep","position":5,"name":"Replace linings if contaminated, reassemble, fill","text":"Replace brake linings if any oil contamination is present — do not clean or heat. Refit hub with correct bearing preload. Fill axle with Scania Axle Fluid to correct level. Recheck hub face for weeping after a short test run."}]},{"@type":"Organization","name":"Parts Trading Company","url":"https://partstrading.com","foundingDate":"1956","address":{"@type":"PostalAddress","addressLocality":"Mumbai","addressCountry":"IN"}},{"@type":"WebPage","name":"Scania Rear Axle Cassette Hub Seal 2027296","url":"https://partstrading.com/scania/transmission-parts/2027296","speakable":{"@type":"SpeakableSpecification","cssSelector":["#sec-faq","#sec-quickref",".hero-h1",".hero-sub"]}}]}</script>

window.PTC_CUSTOM_SECTIONS=function(){
  return SEC('sec-what','01','Axle Sealing','What the Cassette Seal Does','The last line of defence between axle oil and brake linings.',
  '<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8;margin-bottom:20px">The Scania rear axle contains gear oil that lubricates the differential gears, crown wheel and pinion, and the planetary gears of the hub reduction system. This oil is retained within the axle casing and hub by a series of seals — the outermost of these, sitting between the rotating hub and the fixed stub axle, is the wheel hub oil seal.</p>'
  +'<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8;margin-bottom:20px">Part 2027296 is a cassette-type oil seal — a pre-assembled unit integrating the primary lip seal, the garter spring that holds the lip against the rotating stub axle, a pressed steel outer case for interference fit into the hub bore, and a debris excluder lip that prevents road grit from reaching the primary seal. All four components arrive factory-aligned to exact tolerances in a single ready-to-press unit.</p>'
  +'<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8;margin-bottom:20px">The cassette design is a significant improvement over conventional single-lip seals. A conventional seal must be pressed to exact depth and exactly perpendicular — any tilt or over-driving causes immediate or premature failure. The cassette presses flush to the hub face and self-aligns, eliminating the most common installation errors.</p>'
  +'<p style="font-size:.95rem;color:rgba(240,236,230,.7);line-height:1.8">When this seal fails, axle oil migrates outward past the hub and reaches the brake drum and linings. Oil-contaminated linings have a fraction of normal friction coefficient — braking is compromised on that wheel, creating a dangerous side-to-side braking imbalance. This makes 2027296 a safety-critical part, not merely a maintenance item.</p>')

  +SEC('sec-cassette','06','Seal Technology','Why a Cassette Seal','Four components, one installation — how the cassette design prevents the most common seal failures.',

  +'<div class="cassette-card"><div class="cassette-label">Component 2</div><div class="cassette-title">Garter Spring</div><div class="cassette-desc">A coil spring that encircles the primary lip and maintains consistent radial load as the rubber naturally relaxes over time. Without the garter spring, the lip loses contact with the stub axle as it ages, leading to seeping leaks at apparently random intervals in the seal\'s service life.</div></div>'

  +SEC('sec-replace','07','Workshop Guide','Replacement Procedure','Key steps for correct cassette seal installation.',

  +'<div class="install-step"><div class="step-num">02</div><div class="step-body"><div class="step-title">Remove Hub and Inspect Stub Axle</div><div class="step-desc">Remove hub cap, split pin, and hub nut. Extract the hub assembly. Inspect the stub axle running surface carefully — a wear groove where the old seal lip ran must be repaired. Options: dress lightly with 400-grit emery cloth if shallow, or fit a Speedi-Sleeve wear sleeve. Do not fit a new seal over a grooved stub — it will leak immediately.</div></div></div>'

  +SEC('sec-faq','09','FAQ','Frequently Asked Questions','',
  '<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What is Scania part 2027296?</span><span class="faq-icon">+</span></div><div class="faq-a">Part 2027296 is the cassette-type oil seal for the Scania rear axle wheel hub. A pre-assembled unit combining the primary lip seal, garter spring, outer metal case, and debris excluder — all factory-aligned. It prevents axle oil from migrating past the hub and contaminating brake linings. Fits G, R, P, S Series trucks with hub reduction rear axles.</div></div>'

  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What symptoms indicate a failing hub seal?</span><span class="faq-icon">+</span></div><div class="faq-a">Symptoms: oil wetness at the hub face, low axle oil level on periodic check, oily or glazed brake linings, oil visible on the inner wheel face, and brake pull to one side under braking. Early detection (hub face wetness only) allows seal replacement before linings are contaminated.</div></div>'

  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What axle oil does the Scania rear axle use?</span><span class="faq-icon">+</span></div><div class="faq-a">Scania specifies Scania Axle Fluid (SAF) for rear axles with limited-slip differential, and Scania Gear Oil for standard open differentials. The OEM-specification cassette seal compound resists both. Do not use conventional motor oil or generic gear oil — they degrade seal compounds.</div></div>'

  +'<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)"><span class="faq-q-text">What causes premature hub seal failure?</span><span class="faq-icon">+</span></div><div class="faq-a">Causes: (1) Worn stub axle running surface — scores the seal lip; (2) Incorrect installation depth or tilt; (3) Overfilled axle; (4) Wrong oil specification dissolving seal compound; (5) Missing or damaged debris excluder allowing grit to reach the primary lip. Always inspect and dress the stub axle surface before fitting a new seal.</div></div>'
