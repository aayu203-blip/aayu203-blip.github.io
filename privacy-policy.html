// ── READING PROGRESS ──────────────────────────────────────────────────────────
function ReadingProgress(){
  const [pct,setPct]=useState(0);
  useEffect(()=>{
    const fn=()=>{
      const doc=document.documentElement;
      const scrolled=doc.scrollTop||document.body.scrollTop;
      const total=doc.scrollHeight-doc.clientHeight;
      setPct(total>0?Math.min(100,(scrolled/total)*100):0);
    };
    window.addEventListener('scroll',fn,{passive:true});
    return()=>window.removeEventListener('scroll',fn);
  },[]);
  return(
    <div style={{position:'fixed',top:0,left:0,right:0,zIndex:10000,height:3,background:'rgba(255,255,255,0.04)',pointerEvents:'none'}}>
      <div style={{height:'100%',background:AMBER,width:`${pct}%`,transition:'width 0.1s linear',boxShadow:`0 0 10px ${AMBER}66`}}/>
    </div>
  );
}

// ── REVEAL HOOK ───────────────────────────────────────────────────────────────
function useReveal(){
  const ref=useRef();
  useEffect(()=>{
    const el=ref.current; if(!el) return;
    const obs=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add('in');obs.disconnect();}},{threshold:0.1});
    obs.observe(el);
    return()=>obs.disconnect();
  },[]);
  return ref;
}

// ── SCROLL SPY ────────────────────────────────────────────────────────────────
function useScrollSpy(ids){
  const [active,setActive]=useState(ids[0]);
  useEffect(()=>{
    const obs=new IntersectionObserver(entries=>{
      entries.forEach(e=>{if(e.isIntersecting) setActive(e.target.id);});
    },{rootMargin:'-20% 0px -70% 0px'});
    ids.forEach(id=>{const el=document.getElementById(id);if(el) obs.observe(el);});
    return()=>obs.disconnect();
  },[ids.join(',')]);
  return active;
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState('privacy');
  const [geo,setGeo]=useState(null);
  const [searchOpen,setSearchOpen]=useState(false);

  useEffect(()=>{
    fetch('https://ipapi.co/json/?fields=country_code,country_name,timezone,continent_code')
      .then(r=>r.json())
      .then(d=>setGeo({country:d.country_code||'',countryName:d.country_name||'',timezone:d.timezone||'',continent:d.continent_code||''}))
      .catch(()=>{});
  },[]);
  useEffect(()=>{window.scrollTo(0,0);},[page]);

  const openSearch=useCallback(()=>setSearchOpen(true),[]);
  const closeSearch=useCallback(()=>setSearchOpen(false),[]);

  const content=useMemo(()=>{
    switch(page){
      case 'about':    return <AboutPage/>;
      case 'contact':  return <ContactPage/>;
      case 'quote':    return <QuotePage/>;
      case 'shipping': return <ShippingPage/>;
      case 'oem':      return <OEMPage/>;
      case '404':      return <NotFoundPage/>;
      case 'privacy':  return <PrivacyPage/>;
      default:         return <AboutPage/>;
    }
  },[page]);

  return(
    <GeoCtx.Provider value={geo}>
      <ReadingProgress/>
      <div style={{background:T.bg,minHeight:'100vh'}}>
        <AnnouncementBar/>
        <Nav onSearchOpen={openSearch}/>
        <main>{content}</main>
        <Footer/>
        <WAFloatPill/>
        <SearchModal open={searchOpen} onClose={closeSearch}/>
      </div>
    </GeoCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
