    }

      animation: fadeUp 0.8s 0.36s ease both;
    }

    .fu4 {
      animation: fadeUp 0.8s 0.54s ease both;
    }

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: 0.4
      }
    }

      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% {
        left: -100%
      }

      100% {
        left: 200%
      }
    }

    .card-shine {
      position: relative;
      overflow: hidden;
    }

    .card-shine::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 184, 28, 0.04), transparent);
      transition: none;
      pointer-events: none;
    }

    .card-shine:hover::after {
      animation: shimmer 0.7s ease forwards;
    }

    @keyframes countUp {
      from {
        opacity: 0;
        transform: translateY(20px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .count-in {
      animation: countUp 0.6s ease both;
    }

      0%,

function useInView(options = {}) {
  const ref = useRef();
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) {
        setInView(true);
        obs.disconnect();
      }
    }, options);
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);
  return [ref, inView];
}
function useCounter(target, inView, duration = 1800) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!inView) return;
    let start = null;
    const step = ts => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const ease = 1 - Math.pow(1 - p, 3);
      setVal(Math.floor(ease * target));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [inView, target]);
  return val;
}
function useDispatchCountdown() {
  const [time, setTime] = useState('');
  useEffect(() => {
    const calc = () => {
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US', {
        timeZone: 'Asia/Kolkata'
      }));
      const cutoff = new Date(ist);
      cutoff.setHours(15, 0, 0, 0);
      if (ist >= cutoff) {
        setTime('Tomorrow at 9 AM');
        return;
      }
      const diff = cutoff - ist;
      const h = Math.floor(diff / 3600000);
      const m = Math.floor(diff % 3600000 / 60000);
      setTime(`${h}h ${m}m`);
    };
    calc();
    const id = setInterval(calc, 30000);
    return () => clearInterval(id);
  }, []);
  return time;
}
