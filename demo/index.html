function useInView(options={}) {
  const ref = useRef();
  const [inView,setInView] = useState(false);
  useEffect(()=>{
    const obs = new IntersectionObserver(([e])=>{if(e.isIntersecting){setInView(true);obs.disconnect();}},options);
    if(ref.current) obs.observe(ref.current);
    return()=>obs.disconnect();
  },[]);
  return [ref,inView];
}

function useCounter(target, inView, duration=1800) {
  const [val,setVal] = useState(0);
  useEffect(()=>{
    if(!inView) return;
    let start=null;
    const step = ts => {
      if(!start) start=ts;
      const p = Math.min((ts-start)/duration,1);
      const ease = 1-Math.pow(1-p,3);
      setVal(Math.floor(ease*target));
      if(p<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  },[inView,target]);
  return val;
}

function useDispatchCountdown() {
  const [time,setTime] = useState('');
  useEffect(()=>{
    const calc=()=>{
      const now = new Date();
      const ist = new Date(now.toLocaleString('en-US',{timeZone:'Asia/Kolkata'}));
      const cutoff = new Date(ist);
      cutoff.setHours(15,0,0,0);
      if(ist>=cutoff){setTime('Tomorrow at 9 AM');return;}
      const diff = cutoff-ist;
      const h = Math.floor(diff/3600000);
      const m = Math.floor((diff%3600000)/60000);
      setTime(`${h}h ${m}m`);
    };
    calc();
    const id=setInterval(calc,30000);
    return()=>clearInterval(id);
  },[]);
  return time;
}

function HeroSearch(){
  const [q,setQ]=useState('');
  const [results,setResults]=useState([]);
  const [focused,setFocused]=useState(false);
  const [brand,setBrand]=useState('All');
  const ref=useRef();

  // Try to use the live search DB if loaded, fall back to sample parts
  const searchParts = useCallback((query, brandFilter) => {
    if(query.length < 2) return [];
    const lq = query.toLowerCase();
    // Try live window.productSearchDB first
    if(window.productSearchDB && window.productSearchDB.length > 0) {
      return window.productSearchDB
        .filter(p => {
          const matchQ = (p.part||'').toLowerCase().includes(lq) || (p.desc||'').toLowerCase().includes(lq) || (p.brand||'').toLowerCase().includes(lq);
          const matchB = brandFilter === 'All' || (p.brand||'').toLowerCase() === brandFilter.toLowerCase();
          return matchQ && matchB;
        }).slice(0,7);

    return SAMPLE_PARTS.filter(p =>
      (p.part.toLowerCase().includes(lq) || p.desc.toLowerCase().includes(lq) || p.brand.toLowerCase().includes(lq)) &&
      (brandFilter==='All' || p.brand===brandFilter)
    ).slice(0,7);
  }, []);

  useEffect(()=>{
