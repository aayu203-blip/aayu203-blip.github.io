        }
        
        .card-hover {
            transition: all 0.3s ease;
        }
        
        .card-hover:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }
        
        .brand-logo {
            filter: grayscale(100%);
            transition: all 0.3s ease;
        }
        
        .brand-logo:hover {
            filter: grayscale(0%);
            transform: scale(1.1);
        }
        
        .floating-animation {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Random floating animation for particles */
        .animate-float-random {
            animation: floatRandom 8s ease-in-out infinite;
        }

        @keyframes floatRandom {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(20px, -15px) rotate(90deg); }
            50% { transform: translate(-10px, -25px) rotate(180deg); }
            75% { transform: translate(-15px, -10px) rotate(270deg); }
            100% { transform: translate(0, 0) rotate(360deg); }
        }

        /* Floating shape animations */
        .animate-float-slow {
            animation: floatSlow 8s ease-in-out infinite;
        }

        .animate-float-medium {
            animation: floatMedium 6s ease-in-out infinite;
        }

        .animate-float-fast {
            animation: floatFast 4s ease-in-out infinite;
        }

        /* Make floating shapes more visible */
        .floating-shape {
            filter: drop-shadow(0 0 8px rgba(251, 191, 36, 0.3));
        }

        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes floatMedium {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(90deg); }
        }

        @keyframes floatFast {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(45deg); }
        }

        /* Pattern line animations */
        .animate-pattern-slide {
            animation: patternSlide 6s linear infinite;
        }

        @keyframes patternSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        /* Hexagon shape */
        .floating-shape.hexagon {
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
        }

        /* Diamond shape */
        .floating-shape.diamond {
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
        }

        /* Text cycling animations */
        .tagline-container {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 0;
            width: 100%;
        }
        
        .equipment-cycler, .parts-cycler {
            display: inline-block;
            position: relative;
            width: 450px;
            text-align: left;
            transition: opacity 0.3s ease;
            overflow: visible;
        }
        
        .parts-cycler {
            width: 300px;
        }

        /* Gradient shift animations */
        .gradient-shift {
            background: linear-gradient(to bottom, #fefce8 0%, #ffffff 100%);
            transition: background 0.3s ease;
        }

        .gradient-shift:hover {
            background: linear-gradient(to bottom, #fef3c7 0%, #ffffff 100%);
        }

        /* Scroll-based gradient shifts */
        @media (prefers-reduced-motion: no-preference) {
            .gradient-shift {
                background-size: 200% 200%;
                animation: gradientShift 8s ease infinite;
            }
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Hero Text Animations */
        .animate-slide-in-up {
            animation: slideInUp 1s ease-out forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .animate-slide-in-left {
            animation: slideInLeft 1s ease-out forwards;
            opacity: 0;
            transform: translateX(-30px);
        }

        .animate-slide-in-right {
            animation: slideInRight 1s ease-out forwards;
            opacity: 0;
            transform: translateX(30px);
        }

        @keyframes slideInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Elegant text glow effect */
        .text-glow {
            text-shadow: 0 0 20px rgba(255, 184, 28, 0.5);
        }

        /* Micro-interactions for tagline words */
        .tagline-word {
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            display: inline-block;
        }

        .tagline-word:hover {
            transform: scale(1.02);
            text-shadow: 0 0 25px rgba(255, 184, 28, 0.7);
            color: #fbbf24;
        }



        /* Subtle glow pulse animation */
        .animate-glow-pulse {
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { 
                text-shadow: 0 0 20px rgba(255, 184, 28, 0.5);
            }
            50% { 
                text-shadow: 0 0 30px rgba(255, 184, 28, 0.8), 0 0 40px rgba(255, 184, 28, 0.3);
            }
        }

        /* Massive PARTS styling */
        .parts-massive {
            text-shadow: 0 0 40px rgba(255, 184, 28, 0.8), 0 0 60px rgba(255, 184, 28, 0.4), 0 0 80px rgba(255, 184, 28, 0.2);
            animation: partsGlow 2s ease-in-out infinite;
        }

        @keyframes partsGlow {
            0%, 100% { 
                text-shadow: 0 0 40px rgba(255, 184, 28, 0.8), 0 0 60px rgba(255, 184, 28, 0.4), 0 0 80px rgba(255, 184, 28, 0.2);

            50% {

            }
        }

        /* Subtle pulse animation for emphasis */
        .animate-pulse-subtle {
            animation: pulseSubtle 3s ease-in-out infinite;

            0%, 100% { transform: scale(1); }

// Search and Suggestions Functions
function showSuggestions(query) {
  const suggestionsBox = document.getElementById('search-suggestions');
  if (!suggestionsBox) {
    console.log('Suggestions box not found');
    return;
  }
  if (!query || query.length < 1) {
    suggestionsBox.innerHTML = '';
    suggestionsBox.classList.add('hidden');
    return;
  }
  if (!window.partDatabase || window.partDatabase.length === 0) {
    console.log('Database not loaded');
    suggestionsBox.innerHTML = '<div class="px-4 py-2 text-gray-500">Database not loaded. Please refresh the page.</div>';
    suggestionsBox.classList.remove('hidden');
    return;
  }
  
  // Search with priority: 
  // 1. Exact part number matches
  // 2. Part numbers starting with query
  // 3. Alternate part numbers starting with query
  // 4. Part numbers containing query
  // 5. Alternate part numbers containing query
  // 6. Description matches
  
  const exactPartMatches = window.partDatabase.filter(part =>
    part.partNumber.toLowerCase() === query.toLowerCase()
  );
  
  const partNumbersStartingWith = window.partDatabase.filter(part =>
    part.partNumber.toLowerCase().startsWith(query.toLowerCase()) &&
    part.partNumber.toLowerCase() !== query.toLowerCase()
  );
  
  const alternatePartNumbersStartingWith = window.partDatabase.filter(part =>
    part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
      alt.toLowerCase().startsWith(query.toLowerCase())
    )
  );
  
  const partNumbersContaining = window.partDatabase.filter(part =>
    part.partNumber.toLowerCase().includes(query.toLowerCase()) &&
    !part.partNumber.toLowerCase().startsWith(query.toLowerCase()) &&
    part.partNumber.toLowerCase() !== query.toLowerCase()
  );
  
  const alternatePartNumbersContaining = window.partDatabase.filter(part =>
    part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
      alt.toLowerCase().includes(query.toLowerCase()) &&
      !alt.toLowerCase().startsWith(query.toLowerCase())
    )
  );
  
  const descriptionMatches = window.partDatabase.filter(part =>
    part.description.toLowerCase().includes(query.toLowerCase()) &&
    !part.partNumber.toLowerCase().includes(query.toLowerCase()) &&
    !(part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
      alt.toLowerCase().includes(query.toLowerCase())
    ))
  );
  
  const matches = [
    ...exactPartMatches,
    ...partNumbersStartingWith,
    ...alternatePartNumbersStartingWith,
    ...partNumbersContaining,
    ...alternatePartNumbersContaining,
    ...descriptionMatches
  ].slice(0, 8);
  
  if (matches.length === 0) {
    suggestionsBox.innerHTML = '';
    suggestionsBox.classList.add('hidden');
    return;
  }
  
  suggestionsBox.innerHTML = matches.map(part => {
    const matchingAlternate = part.alternatePartNumbers && part.alternatePartNumbers.find(alt =>
      alt.toLowerCase().includes(query.toLowerCase())
    );
    
    return `<div class='px-4 py-2 cursor-pointer hover:bg-yellow-50' onclick="selectSuggestion('${part.partNumber.replace(/'/g, "\\'")}')">
      <span class='font-semibold text-gray-900'>${part.partNumber}</span> 
      <span class='text-gray-500 text-sm'>${part.description}</span>
      <span class='text-blue-600 text-xs ml-2'>${part.brand}</span>
      ${matchingAlternate ? `<span class='text-green-600 text-xs ml-2'>Alt: ${matchingAlternate}</span>` : ''}
    </div>`;
  }).join('');
  
  suggestionsBox.classList.remove('hidden');
}

function selectSuggestion(partNumber) {
  document.getElementById('partSearch').value = partNumber;
  document.getElementById('search-suggestions').classList.add('hidden');
  searchParts();
}

function searchParts() {
  console.log('searchParts called');
  const searchInput = document.getElementById('partSearch');
  if (!searchInput) { alert('Search input not found!'); return; }
  const query = searchInput.value.trim();
  console.log('Search query:', query);
  if (query.length < 1) {
    alert('Please enter at least 1 character to search');
    return;
  }
  searchInput.disabled = true;
  searchInput.value = 'Searching...';
  setTimeout(() => {
    searchInput.disabled = false;
    searchInput.value = query;
    
    if (!window.partDatabase || window.partDatabase.length === 0) {
      console.error('Part database not loaded in search!');
      alert('Database not loaded. Please refresh the page.');
      return;
    }
    
    // Search with priority: 
    // 1. Exact part number matches
    // 2. Part numbers starting with query
    // 3. Alternate part numbers starting with query
    // 4. Part numbers containing query
    // 5. Alternate part numbers containing query
    // 6. Description matches
    
    const exactPartMatches = window.partDatabase.filter(part =>
      part.partNumber.toLowerCase() === query.toLowerCase()
    );
    
    const partNumbersStartingWith = window.partDatabase.filter(part =>
      part.partNumber.toLowerCase().startsWith(query.toLowerCase()) &&
      part.partNumber.toLowerCase() !== query.toLowerCase()
    );
    
    const alternatePartNumbersStartingWith = window.partDatabase.filter(part =>
      part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
        alt.toLowerCase().startsWith(query.toLowerCase())
      )
    );
    
    const partNumbersContaining = window.partDatabase.filter(part =>
      part.partNumber.toLowerCase().includes(query.toLowerCase()) &&
      !part.partNumber.toLowerCase().startsWith(query.toLowerCase()) &&
      part.partNumber.toLowerCase() !== query.toLowerCase()
    );
    
    const alternatePartNumbersContaining = window.partDatabase.filter(part =>
      part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
        alt.toLowerCase().includes(query.toLowerCase()) &&
        !alt.toLowerCase().startsWith(query.toLowerCase())
      )
    );
    
    const descriptionMatches = window.partDatabase.filter(part =>
      part.description.toLowerCase().includes(query.toLowerCase()) &&
      !part.partNumber.toLowerCase().includes(query.toLowerCase()) &&
      !(part.alternatePartNumbers && part.alternatePartNumbers.some(alt =>
        alt.toLowerCase().includes(query.toLowerCase())
      ))
    );
    
    console.log('Search results - Exact:', exactPartMatches.length, 'Starting with:', partNumbersStartingWith.length, 'Alt starting with:', alternatePartNumbersStartingWith.length, 'Containing:', partNumbersContaining.length, 'Alt containing:', alternatePartNumbersContaining.length, 'Description:', descriptionMatches.length);
    
    const results = [
      ...exactPartMatches,
      ...partNumbersStartingWith,
      ...alternatePartNumbersStartingWith,
      ...partNumbersContaining,
      ...alternatePartNumbersContaining,
      ...descriptionMatches
    ];
    showSearchResults(results, query);
  }, 500);
}

// Event Listeners
window.addEventListener('click', function(e) {
  const box = document.getElementById('search-suggestions');
  if (box && !box.contains(e.target) && e.target.id !== 'partSearch') {
    box.classList.add('hidden');
  }
});

document.addEventListener('DOMContentLoaded', function() {
  var input = document.getElementById('partSearch');
  console.log('Search input found:', input);
  if (input) {
    input.oninput = function() { 
      console.log('Input value:', this.value);
      showSuggestions(this.value); 
    };
    input.onkeydown = function(e) { if(e.key==='Enter'){ e.preventDefault(); searchParts(); } };
  }
  var btn = document.querySelector('button[onclick="searchParts()"]');
  if (btn) {
    btn.onclick = function() { searchParts(); };
  }
  console.log('Part database loaded with', window.partDatabase?.length, 'parts');
});

                            <svg class='w-4 h-4' fill='none' stroke='currentColor' viewBox='0 0 24 24'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M15 17h5l-1.405-1.405M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4'></path></svg>
                            Go to Product Page
                        </a>
                        <button onclick="requestQuoteOnWhatsApp('${result.partNumber}', '${result.description}', '${result.brand}', '${result.category}', '${result.application}')" class="flex-1 bg-green-500 text-white px-4 py-2.5 rounded-lg font-semibold hover:bg-green-600 transition-colors duration-200 flex items-center justify-center gap-2 text-sm">
                            <svg class='w-4 h-4' fill='currentColor' viewBox='0 0 24 24'><path d='M24 11.7c0 6.45-5.27 11.68-11.78 11.68-2.07 0-4-.53-5.7-1.45L0 24l2.13-6.27a11.57 11.57 0 0 1-1.7-6.04C.44 5.23 5.72 0 12.23 0 18.72 0 24 5.23 24 11.7M12.22 1.85c-5.46 0-9.9 4.41-9.9 9.83 0 2.15.7 4.14 1.88 5.76L2.96 21.1l3.8-1.2a9.9 9.9 0 0 0 5.46 1.62c5.46 0 9.9-4.4 9.9-9.83a9.88 9.88 0 0 0-9.9-9.83m5.95 12.52c-.08-.12-.27-.19-.56-.33-.28-.14-1.7-.84-1.97-.93-.26-.1-.46-.15-.65.14-.2.29-.75.93-.91 1.12-.17.2-.34.22-.63.08-.29-.15-1.22-.45-2.32-1.43a8.64 8.64 0 0 1-1.6-1.98c-.18-.29-.03-.44.12-.58.13-.13.29-.34.43-.5.15-.17.2-.3.29-.48.1-.2.05-.36-.02-.5-.08-.15-.65-1.56-.9-2.13-.24-.58-.48-.48-.65-.48-.17 0-.37-.03-.56-.03-.2 0-.5.08-.77.36-.26.29-1 .98-1 2.4 0 1.4 1.03 2.76 1.17 2.96.14.19 2 3.17 4.93 4.32 2.94 1.15 2.94.77 3.47.72.53-.05 1.7-.7 1.95-1.36.24-.67.24-1.25.17-1.37'/></svg>
                            Get Quote
                        </button>
                    </div>
                </div>
            `;
        });
    }
    
    modal.innerHTML = `
        <div class="bg-white rounded-2xl p-6 max-w-2xl w-full mx-4 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-xl font-bold text-gray-900">Search Results</h3>
                    <p class="text-sm text-gray-500 mt-1">${results.length === 0 ? 'No results found' : `Found ${results.length} result${results.length !== 1 ? 's' : ''} for "${query}"`}</p>
                </div>
                <button onclick="closeSearchModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-light transition-colors duration-200">&times;</button>
            </div>
            <div class="space-y-4">
                ${resultsHtml}
            </div>
            ${results.length > 0 ? `
            <div class="mt-8 pt-6 border-t border-gray-100 text-center">
                <button onclick="contactForPart()" class="bg-yellow-400 text-gray-900 px-8 py-3 rounded-xl font-semibold hover:bg-yellow-500 transition-colors duration-200">
                    Need More Parts?
                </button>
            </div>
            ` : ''}
        </div>
    `;
    
    document.body.appendChild(modal);
}

// Helper to get product page link
function getProductPageLink(result) {
    // Use part number-based pages: /products/{partNumber-lowercase}.html
    return `products/${result.partNumber.toLowerCase().replace(/[^a-z0-9]/g, '-')}.html`;
}

// WhatsApp quote button handler
function requestQuoteOnWhatsApp(partNumber, description, brand, category, application) {
    const message = `Hi! I am interested in the following part:%0A%0APart Number: ${partNumber}%0ADescription: ${description}%0ABrand: ${brand}%0ACategory: ${category}%0AApplication: ${application}%0A%0APlease provide a quote and availability.`;
    const whatsappUrl = `https://wa.me/919821037990?text=${message}`;
    window.open(whatsappUrl, '_blank');
}
</script>
